<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>草圖設計工作室 - 人事薪資與差勤管理系統 (勞基法合規版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background-color: white !important; font-size: 12pt; }
            .print-page { page-break-after: always; margin: 0; padding: 1.5cm; }
            .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl { box-shadow: none !important; }
            .border { border-color: #cbd5e1 !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 預載員工資料 (含使用者指定之 T9014 姜美辰, T701 戴葳葳, T801 姚芳庭, T901 林恩希, T914 莊凱鈞)
        const initialEmployees = [
            { id: "T9014", name: "姜美辰", dept: "草圖設計部", title: "專案設計師", baseSalary: 45000, mealAllowance: 3000, positionAllowance: 2000, bonus: 2000, laborGrade: 45800, healthGrade: 45800, bankAccount: "822-123456789012", onboardDate: "2024-03-15" },
            { id: "T701",  name: "戴葳葳", dept: "草圖設計部", title: "資深設計師", baseSalary: 50000, mealAllowance: 3000, positionAllowance: 5000, bonus: 3000, laborGrade: 50600, healthGrade: 50600, bankAccount: "013-987654321098", onboardDate: "2022-09-01" },
            { id: "T801",  name: "姚芳庭", dept: "營運管理部", title: "專案經理",   baseSalary: 48000, mealAllowance: 3000, positionAllowance: 4000, bonus: 2500, laborGrade: 48200, healthGrade: 48200, bankAccount: "808-555444333222", onboardDate: "2023-01-10" },
            { id: "T901",  name: "林恩希", dept: "多媒體設計部", title: "視覺設計師", baseSalary: 42000, mealAllowance: 3000, positionAllowance: 2000, bonus: 1500, laborGrade: 43900, healthGrade: 43900, bankAccount: "004-111222333444", onboardDate: "2024-06-01" },
            { id: "T914",  name: "莊凱鈞", dept: "資訊技術部", title: "系統工程師", baseSalary: 46000, mealAllowance: 3000, positionAllowance: 3000, bonus: 2000, laborGrade: 45800, healthGrade: 45800, bankAccount: "012-777888999000", onboardDate: "2024-08-16" }
        ];

        // 預載差勤紀錄 (包含戴葳葳 Wed Sep 16 2026 事假 8小時)
        const initialAttendanceLogs = [
            { empId: "T701", empName: "戴葳葳", category: "請假", item: "事假", hours: 8, amount: -1667, status: "已核准", date: "2026-09-16", reason: "有事情請假" }
        ];

        // 勞健保費率對照表 (2026預估常規)
        const calculateLaborInsurance = (wage) => {
            const laborRate = 0.115; // 勞保費率11.5%
            const selfShare = 0.20;  // 個人自負20%
            return Math.round(wage * laborRate * selfShare);
        };

        const calculateHealthInsurance = (wage) => {
            const healthRate = 0.0517; // 健保費率5.17%
            const selfShare = 0.30;    // 個人自負30%
            return Math.round(wage * healthRate * selfShare);
        };

        function App() {
            // 登入狀態
            const [isLoggedIn, setIsLoggedIn] = useState(true);
            const [currentUser, setCurrentUser] = useState({ id: "admin", name: "系統管理員", role: "admin" });
            const [loginForm, setLoginForm] = useState({ username: "admin", password: "123" });

            // 系統資料狀態
            const [employees, setEmployees] = useState(initialEmployees);
            const [attendanceLogs, setAttendanceLogs] = useState(initialAttendanceLogs);
            const [currentTab, setCurrentTab] = useState("dashboard"); // dashboard, salary, employees, csvImport, payslip, company, laborLaw
            const [selectedEmpId, setSelectedEmpId] = useState("T701");
            const [payPeriod, setPayPeriod] = useState("2026-09");
            
            // 模態視窗狀態 (新增/刪除員工)
            const [showAddModal, setShowAddModal] = useState(false);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [empToDelete, setEmpToDelete] = useState(null);

            // 新增員工表單狀態
            const [newEmp, setNewEmp] = useState({
                id: "", name: "", dept: "草圖設計部", title: "設計師",
                baseSalary: 42000, mealAllowance: 3000, positionAllowance: 2000, bonus: 0,
                laborGrade: 45800, healthGrade: 45800, bankAccount: "", onboardDate: "2026-09-01"
            });

            // 公司資訊
            const [company, setCompany] = useState({
                name: "草圖設計工作室",
                taxId: "83749201",
                address: "新竹市東區光復路二段100號",
                phone: "03-5712345",
                hrManager: "戴葳葳",
                payDay: "每月 1 日 (遇假日順延)",
                nextPayDate: "2026-10-01",
                baseHours: 240
            });

            // 請假與加班時數統計 (依員工)
            const getEmpAttendanceSummary = (empId) => {
                const empLogs = attendanceLogs.filter(log => log.empId === empId && log.status === "已核准");
                let unpaidLeaveHours = 0;   // 事假
                let halfPaidLeaveHours = 0; // 病假、生理假
                let otWeekdayHours = 0;     // 平日加班
                let otRestdayHours = 0;     // 休息日加班
                let otNationalHours = 0;    // 國定假日加班

                empLogs.forEach(log => {
                    if (log.category === "請假") {
                        if (log.item === "事假" || log.item === "曠職") {
                            unpaidLeaveHours += Number(log.時數 || log.hours || 0);
                        } else if (log.item === "病假" || log.item === "生理假") {
                            halfPaidLeaveHours += Number(log.時數 || log.hours || 0);
                        }
                    } else if (log.category === "加班") {
                        if (log.item.includes("平日")) otWeekdayHours += Number(log.時數 || log.hours || 0);
                        else if (log.item.includes("休息日")) otRestdayHours += Number(log.時數 || log.hours || 0);
                        else if (log.item.includes("國定")) otNationalHours += Number(log.時數 || log.hours || 0);
                        else otWeekdayHours += Number(log.時數 || log.hours || 0);
                    }
                });

                return { unpaidLeaveHours, halfPaidLeaveHours, otWeekdayHours, otRestdayHours, otNationalHours, logs: empLogs };
            };

            // 勞基法薪資計算邏輯
            const calculateSalary = (emp) => {
                const totalFixed = emp.baseSalary + emp.mealAllowance + emp.positionAllowance;
                const hourlyRate = Math.round((totalFixed / 240) * 100) / 100; // 勞基法每小時工資額
                
                const att = getEmpAttendanceSummary(emp.id);

                // 請假扣款
                const unpaidDeduction = Math.round(att.unpaidLeaveHours * hourlyRate);
                const halfPaidDeduction = Math.round(att.halfPaidLeaveHours * hourlyRate * 0.5);
                const totalLeaveDeduction = unpaidDeduction + halfPaidDeduction;

                // 加班費計算 (依勞基法第24條)
                // 平日加班：前2小時 1.34倍，第3-4小時 1.67倍
                const otWeekdayFee = att.otWeekdayHours <= 2 
                    ? Math.round(att.otWeekdayHours * hourlyRate * 1.34)
                    : Math.round(2 * hourlyRate * 1.34 + (att.otWeekdayHours - 2) * hourlyRate * 1.67);

                // 休息日加班：前2小時 1.34倍，3-8小時 1.67倍
                const otRestdayFee = att.otRestdayHours <= 2
                    ? Math.round(att.otRestdayHours * hourlyRate * 1.34)
                    : Math.round(2 * hourlyRate * 1.34 + (att.otRestdayHours - 2) * hourlyRate * 1.67);

                // 國定假日加班：加倍發給 (2.0倍)
                const otNationalFee = Math.round(att.otNationalHours * hourlyRate * 2.0);

                const totalOvertimeFee = otWeekdayFee + otRestdayFee + otNationalFee;

                // 應發總額
                const totalGross = totalFixed + emp.bonus + totalOvertimeFee;

                // 應扣項目 (勞保自付、健保自付、請假扣款)
                const laborSelf = calculateLaborInsurance(emp.laborGrade);
                const healthSelf = calculateHealthInsurance(emp.healthGrade);
                const totalDeductions = laborSelf + healthSelf + totalLeaveDeduction;

                // 實領金額
                const netPay = totalGross - totalDeductions;

                // 雇主勞退 6% 提繳
                const laborPensionCompany = Math.round(emp.laborGrade * 0.06);

                return {
                    hourlyRate,
                    totalFixed,
                    unpaidDeduction,
                    halfPaidDeduction,
                    totalLeaveDeduction,
                    otWeekdayFee,
                    otRestdayFee,
                    otNationalFee,
                    totalOvertimeFee,
                    totalGross,
                    laborSelf,
                    healthSelf,
                    totalDeductions,
                    netPay,
                    laborPensionCompany,
                    att
                };
            };

            // 全體薪資總計計算
            const salarySummary = useMemo(() => {
                let grossTotal = 0;
                let netTotal = 0;
                let otTotal = 0;
                let leaveDeductionTotal = 0;

                employees.forEach(emp => {
                    const calc = calculateSalary(emp);
                    grossTotal += calc.totalGross;
                    netTotal += calc.netPay;
                    otTotal += calc.totalOvertimeFee;
                    leaveDeductionTotal += calc.totalLeaveDeduction;
                });

                return { grossTotal, netTotal, otTotal, leaveDeductionTotal, empCount: employees.length };
            }, [employees, attendanceLogs]);

            // 處理 CSV 匯入 (完整解碼與讀取上傳之 CSV)
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const lines = text.split(/\r\n|\n/);
                    if (lines.length < 2) return;

                    const newLogs = [];
                    // 跳過標題列
                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const cols = line.split(',').map(c => c.replace(/^["']|["']$/g, '').trim());
                        if (cols.length >= 7) {
                            // 支援格式：工號,姓名,類別,項目,開始,結束,時數,事由,試算金額,狀態
                            const [empId, empName, category, item, start, end, hours, reason, amount, status] = cols;
                            newLogs.push({
                                empId: empId || "T701",
                                empName: empName || "未命名",
                                category: category || "請假",
                                item: item || "事假",
                                hours: parseFloat(hours) || 0,
                                amount: parseInt(amount) || 0,
                                status: status || "已核准",
                                reason: reason || "",
                                date: start ? start.substring(0, 15) : "2026-09-16"
                            });
                        }
                    }

                    if (newLogs.length > 0) {
                        setAttendanceLogs(prev => [...prev, ...newLogs]);
                        alert(`成功匯入 ${newLogs.length} 筆差勤/加班資料！已自動納入薪資試算。`);
                    } else {
                        alert("匯入失敗：請確認 CSV 檔案格式符合規範。");
                    }
                };
                reader.readAsText(file, 'UTF-8');
            };

            // 處理新增員工
            const handleAddEmployee = (e) => {
                e.preventDefault();
                if (!newEmp.id || !newEmp.name) {
                    alert("請填寫工號與姓名！");
                    return;
                }
                if (employees.some(emp => emp.id === newEmp.id)) {
                    alert(`工號 ${newEmp.id} 已存在，請使用不同工號！`);
                    return;
                }

                const empObj = {
                    ...newEmp,
                    baseSalary: Number(newEmp.baseSalary),
                    mealAllowance: Number(newEmp.mealAllowance),
                    positionAllowance: Number(newEmp.positionAllowance),
                    bonus: Number(newEmp.bonus),
                    laborGrade: Number(newEmp.laborGrade || newEmp.baseSalary),
                    healthGrade: Number(newEmp.healthGrade || newEmp.baseSalary)
                };

                setEmployees([...employees, empObj]);
                setShowAddModal(false);
                setNewEmp({
                    id: "", name: "", dept: "草圖設計部", title: "設計師",
                    baseSalary: 42000, mealAllowance: 3000, positionAllowance: 2000, bonus: 0,
                    laborGrade: 45800, healthGrade: 45800, bankAccount: "", onboardDate: "2026-09-01"
                });
                alert(`已成功新增員工：${empObj.name} (${empObj.id})`);
            };

            // 處理刪除員工
            const confirmDeleteEmployee = () => {
                if (!empToDelete) return;
                setEmployees(employees.filter(emp => emp.id !== empToDelete.id));
                // 如果刪除的是當前選取的薪資單員工，重置選取
                if (selectedEmpId === empToDelete.id) {
                    const remaining = employees.filter(emp => emp.id !== empToDelete.id);
                    if (remaining.length > 0) setSelectedEmpId(remaining[0].id);
                }
                setShowDeleteModal(false);
                setEmpToDelete(null);
            };

            // 登入介面
            if (!isLoggedIn) {
                return (
                    <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                        <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-700">
                            <div className="bg-gradient-to-r from-blue-700 to-indigo-800 p-8 text-white text-center">
                                <div className="inline-flex items-center justify-center w-16 h-16 bg-white/10 rounded-2xl mb-4 backdrop-blur-md">
                                    <i className="fa-solid fa-compass-drafting text-3xl text-blue-300"></i>
                                </div>
                                <h1 className="text-2xl font-bold tracking-wide">草圖設計工作室</h1>
                                <p className="text-blue-200 text-sm mt-1">人事薪資與差勤管理系統 (勞基法合規)</p>
                            </div>
                            <form onSubmit={(e) => { e.preventDefault(); setIsLoggedIn(true); }} className="p-8 space-y-5">
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-2">管理員帳號</label>
                                    <div className="relative">
                                        <i className="fa-solid fa-user absolute left-3 top-3.5 text-slate-400"></i>
                                        <input 
                                            type="text" 
                                            value={loginForm.username}
                                            onChange={(e) => setLoginForm({...loginForm, username: e.target.value})}
                                            className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 font-medium"
                                            placeholder="請輸入帳號"
                                            required
                                        />
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-semibold text-slate-600 uppercase mb-2">密碼</label>
                                    <div className="relative">
                                        <i className="fa-solid fa-lock absolute left-3 top-3.5 text-slate-400"></i>
                                        <input 
                                            type="password" 
                                            value={loginForm.password}
                                            onChange={(e) => setLoginForm({...loginForm, password: e.target.value})}
                                            className="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none text-slate-800 font-medium"
                                            placeholder="請輸入密碼"
                                            required
                                        />
                                    </div>
                                </div>
                                <div className="flex items-center justify-between text-xs text-slate-500">
                                    <label className="flex items-center cursor-pointer">
                                        <input type="checkbox" defaultChecked className="rounded text-blue-600 mr-2" /> 記住這台裝置
                                    </label>
                                    <a href="#" className="text-blue-600 hover:underline">忘記密碼？</a>
                                </div>
                                <button type="submit" className="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl shadow-lg shadow-blue-500/30 transition-all flex items-center justify-center gap-2">
                                    <i className="fa-solid fa-right-to-bracket"></i> 登入系統
                                </button>
                                <div className="mt-6 pt-4 border-t border-slate-100 text-center">
                                    <span className="text-xs text-slate-400">系統預設管理者：admin / 密碼：123</span>
                                </div>
                            </form>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col md:flex-row bg-slate-100">
                    {/* 側邊導覽列 */}
                    <aside className="w-full md:w-64 bg-slate-900 text-slate-300 flex-shrink-0 no-print">
                        <div className="p-6 border-b border-slate-800 flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-lg shadow-md shadow-blue-500/20">
                                草
                            </div>
                            <div>
                                <h2 className="font-bold text-white leading-tight">草圖設計工作室</h2>
                                <p className="text-xs text-slate-400 mt-0.5">薪資管理系統 v2.5</p>
                            </div>
                        </div>

                        {/* 使用者簡介 */}
                        <div className="px-6 py-4 bg-slate-800/50 flex items-center justify-between border-b border-slate-800">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 rounded-full bg-indigo-500 text-white flex items-center justify-center font-semibold text-xs">
                                    管
                                </div>
                                <div>
                                    <p className="text-xs font-semibold text-slate-200">{currentUser.name}</p>
                                    <p className="text-[10px] text-emerald-400 font-medium">系統最高管理員</p>
                                </div>
                            </div>
                            <button onClick={() => setIsLoggedIn(false)} className="text-slate-400 hover:text-rose-400 text-sm" title="登出">
                                <i className="fa-solid fa-power-off"></i>
                            </button>
                        </div>

                        {/* 選單功能 */}
                        <nav className="p-4 space-y-1.5 text-sm font-medium">
                            <button 
                                onClick={() => setCurrentTab("dashboard")} 
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${currentTab === "dashboard" ? "bg-blue-600 text-white font-semibold shadow-lg shadow-blue-600/30" : "hover:bg-slate-800 text-slate-400"}`}
                            >
                                <i className="fa-solid fa-chart-pie w-5 text-center"></i> 系統總覽
                            </button>
                            <button 
                                onClick={() => setCurrentTab("salary")} 
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${currentTab === "salary" ? "bg-blue-600 text-white font-semibold shadow-lg shadow-blue-600/30" : "hover:bg-slate-800 text-slate-400"}`}
                            >
                                <i className="fa-solid fa-file-invoice-dollar w-5 text-center"></i> 薪資明細總表
                            </button>
                            <button 
                                onClick={() => setCurrentTab("employees")} 
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${currentTab === "employees" ? "bg-blue-600 text-white font-semibold shadow-lg shadow-blue-600/30" : "hover:bg-slate-800 text-slate-400"}`}
                            >
                                <i className="fa-solid fa-users w-5 text-center"></i> 員工名冊與管理
                            </button>
                            <button 
                                onClick={() => setCurrentTab("csvImport")} 
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${currentTab === "csvImport" ? "bg-blue-600 text-white font-semibold shadow-lg shadow-blue-600/30" : "hover:bg-slate-800 text-slate-400"}`}
                            >
                                <i className="fa-solid fa-file-csv w-5 text-center"></i> 差勤 CSV 匯入
                            </button>
                            <button 
                                onClick={() => setCurrentTab("payslip")} 
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${currentTab === "payslip" ? "bg-blue-600 text-white font-semibold shadow-lg shadow-blue-600/30" : "hover:bg-slate-800 text-slate-400"}`}
                            >
                                <i className="fa-solid fa-print w-5 text-center"></i> 正式薪資單列印
                            </button>
                            <button 
                                onClick={() => setCurrentTab("company")} 
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${currentTab === "company" ? "bg-blue-600 text-white font-semibold shadow-lg shadow-blue-600/30" : "hover:bg-slate-800 text-slate-400"}`}
                            >
                                <i className="fa-solid fa-building w-5 text-center"></i> 公司資訊與發薪日
                            </button>
                            <button 
                                onClick={() => setCurrentTab("laborLaw")} 
                                className={`w-full flex items-center gap-3 px-4 py-3 rounded-xl transition ${currentTab === "laborLaw" ? "bg-blue-600 text-white font-semibold shadow-lg shadow-blue-600/30" : "hover:bg-slate-800 text-slate-400"}`}
                            >
                                <i className="fa-solid fa-scale-balanced w-5 text-center"></i> 勞基法計算規範
                            </button>
                        </nav>
                    </aside>

                    {/* 主要內容區塊 */}
                    <main className="flex-1 flex flex-col min-w-0 overflow-y-auto">
                        {/* 頂部標題與功能條 */}
                        <header className="bg-white border-b border-slate-200 px-8 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 no-print">
                            <div>
                                <h1 className="text-xl font-bold text-slate-800">
                                    {currentTab === "dashboard" && "儀表板總覽"}
                                    {currentTab === "salary" && "月度全體薪資統計明細表"}
                                    {currentTab === "employees" && "員工名冊資料與權限管理"}
                                    {currentTab === "csvImport" && "匯入差勤與加班 CSV 檔案"}

                                                            {emp.bonus > 0 && <div className="flex justify-between"><span>獎金/其他補助</span><span className="font-mono">${emp.bonus.toLocaleString()}</span></div>}
                                                            {calc.otWeekdayFee > 0 && <div className="flex justify-between text-amber-700"><span>平日加班費</span><span className="font-mono">+${calc.otWeekdayFee.toLocaleString()}</span></div>}
                                                            {calc.otRestdayFee > 0 && <div className="flex justify-between text-amber-700"><span>休息日加班費</span><span className="font-mono">+${calc.otRestdayFee.toLocaleString()}</span></div>}
                                                            <div className="pt-3 border-t border-slate-200 flex justify-between font-bold text-sm text-emerald-700">
                                                                <span>應發總計</span>
                                                                <span className="font-mono">${calc.totalGross.toLocaleString()}</span>
                                                            </div>
                                                        </div>
                                                    </div>

                                                    {/* 右欄：應扣項目 */}
                                                    <div className="border border-slate-200 rounded-xl overflow-hidden">
                                                        <div className="bg-rose-50 text-rose-800 font-bold px-4 py-2.5 text-xs border-b border-slate-200 flex justify-between">
                                                            <span>【應扣項目 (B)】</span>
                                                            <span>金額 (NT$)</span>
                                                        </div>
                                                        <div className="p-4 space-y-2.5 text-xs">
                                                            <div className="flex justify-between"><span>勞保費 (個人自負 20%)</span><span className="font-mono">-${calc.laborSelf.toLocaleString()}</span></div>
                                                            <div className="flex justify-between"><span>健保費 (個人自負 30%)</span><span className="font-mono">-${calc.healthSelf.toLocaleString()}</span></div>
                                                            {calc.unpaidDeduction > 0 && <div className="flex justify-between text-rose-600"><span>事假扣款 ({calc.att.unpaidLeaveHours}小時)</span><span className="font-mono">-${calc.unpaidDeduction.toLocaleString()}</span></div>}
                                                            {calc.halfPaidDeduction > 0 && <div className="flex justify-between text-rose-600"><span>病假/生理假扣款 ({calc.att.halfPaidLeaveHours}小時)</span><span className="font-mono">-${calc.halfPaidDeduction.toLocaleString()}</span></div>}
                                                            <div className="pt-3 border-t border-slate-200 flex justify-between font-bold text-sm text-rose-700">
                                                                <span>應扣總計</span>
                                                                <span className="font-mono">-${calc.totalDeductions.toLocaleString()}</span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>

                                                {/* 實領金額大字卡 */}
                                                <div className="bg-slate-900 text-white p-5 rounded-xl flex items-center justify-between mb-6 shadow-md">
                                                    <div>
                                                        <span className="text-xs font-semibold text-slate-400 uppercase tracking-wider">實領總計 Net Pay (A - B)</span>
                                                        <p className="text-xs text-slate-400 mt-0.5">已由公司會計部核算完畢</p>
                                                    </div>
                                                    <div className="text-3xl font-black font-mono text-emerald-400">
                                                        ${calc.netPay.toLocaleString()}
                                                    </div>
                                                </div>

                                                {/* 勞退提繳與蓋章簽收區 */}
                                                <div className="grid grid-cols-2 gap-6 text-xs pt-4 border-t border-slate-200">
                                                    <div className="space-y-1 text-slate-500">
                                                        <p><strong>雇主負擔與勞退提繳資訊：</strong></p>
                                                        <p>• 雇主依法強制提繳 6% 勞工退休金：<span className="font-mono font-bold text-slate-800">${calc.laborPensionCompany.toLocaleString()}</span> (由公司逕繳勞保局，不自薪資扣除)</p>
                                                        <p>• 勞保投保級距：${emp.laborGrade.toLocaleString()} ｜ 健保投保級距：${emp.healthGrade.toLocaleString()}</p>
                                                    </div>
                                                    <div className="flex justify-around items-end pt-4">
                                                        <div className="text-center">
                                                            <div className="w-24 border-b border-slate-400 mb-1"></div>
                                                            <span className="text-[10px] text-slate-400">製表 / 審核人蓋章</span>
                                                        </div>
                                                        <div className="text-center">
                                                            <div className="w-24 border-b border-slate-400 mb-1"></div>
                                                            <span className="text-[10px] text-slate-400">員工簽收章 (或電郵核對)</span>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })()}
                                </div>
                            )}

                            {/* TAB 6: 公司資訊與參數 */}
                            {currentTab === "company" && (
                                <div className="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm max-w-3xl space-y-6">
                                    <h3 className="text-base font-bold text-slate-800 pb-4 border-b border-slate-200">公司基本資料與薪資參數設定</h3>
                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 text-xs">
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-2">公司名稱</label>
                                            <input type="text" value={company.name} onChange={(e)=>setCompany({...company, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-800 font-bold" />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-2">統一編號</label>
                                            <input type="text" value={company.taxId} onChange={(e)=>setCompany({...company, taxId: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-mono" />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-2">預定每月發薪日</label>
                                            <input type="text" value={company.nextPayDate} onChange={(e)=>setCompany({...company, nextPayDate: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-semibold text-blue-600" />
                                        </div>
                                        <div>
                                            <label className="block font-semibold text-slate-700 mb-2">月工裝時數 (勞基法基準)</label>
                                            <input type="number" value={company.baseHours} onChange={(e)=>setCompany({...company, baseHours: Number(e.target.value)})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-mono" />
                                        </div>
                                    </div>
                                    <div className="pt-4 border-t border-slate-100 flex justify-end">
                                        <button onClick={()=>alert("公司參數已成功儲存！")} className="px-6 py-2.5 bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold rounded-xl shadow-md">
                                            儲存變更
                                        </button>
                                    </div>
                                </div>
                            )}

                            {/* TAB 7: 勞基法法規說明 */}
                            {currentTab === "laborLaw" && (
                                <div className="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm space-y-6 text-xs text-slate-700">
                                    <h3 className="text-base font-bold text-slate-900 border-b border-slate-200 pb-3">中華民國《勞動基準法》薪資計算條文說明</h3>
                                    <div className="space-y-4">
                                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                            <h4 className="font-bold text-slate-900 text-sm mb-1">1. 平日加班費計算 (第 24 條)</h4>
                                            <p className="text-slate-600">延長工作時間在兩小時小時以內者，按平日每小時工資額加給三分之一 (1.34) 以上；再延長工作時間在兩小時以內者，按平日每小時工資額加給三分之二 (1.67) 以上。</p>
                                        </div>
                                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                            <h4 className="font-bold text-slate-900 text-sm mb-1">2. 請假扣款規範 (勞工請假規則)</h4>
                                            <p className="text-slate-600"><strong>事假：</strong>一年內不得超過 14 日，期間不給工資 (扣除 100% 日薪)。<br/><strong>普通傷病假：</strong>一年內未超過 30 日部分，工資折半發給 (扣除 50% 日薪)。</p>
                                        </div>
                                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                                            <h4 className="font-bold text-slate-900 text-sm mb-1">3. 薪資明細發放義務 (第 23 條)</h4>
                                            <p className="text-slate-600">雇主應提供勞工工資各項目計算明細（薪資單），內容應包含工資總額、各項給付、扣繳項目及實領金額。</p>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* 模態視窗 1：新增員工 Modal */}
                    {showAddModal && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden border border-slate-200">
                                <div className="bg-slate-900 text-white px-6 py-4 flex items-center justify-between">
                                    <h3 className="font-bold text-base"><i className="fa-solid fa-user-plus text-blue-400 mr-2"></i> 新增員工資料</h3>
                                    <button onClick={() => setShowAddModal(false)} className="text-slate-400 hover:text-white"><i className="fa-solid fa-xmark text-lg"></i></button>
                                </div>
                                <form onSubmit={handleAddEmployee} className="p-6 space-y-4 text-xs">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">員工工號 *</label>
                                            <input type="text" required placeholder="例如: T915" value={newEmp.id} onChange={(e)=>setNewEmp({...newEmp, id: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-mono font-bold" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">員工姓名 *</label>
                                            <input type="text" required placeholder="例如: 張小明" value={newEmp.name} onChange={(e)=>setNewEmp({...newEmp, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-bold" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">部門</label>
                                            <input type="text" value={newEmp.dept} onChange={(e)=>setNewEmp({...newEmp, dept: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">職稱</label>
                                            <input type="text" value={newEmp.title} onChange={(e)=>setNewEmp({...newEmp, title: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">本薪 (底薪 NT$) *</label>
                                            <input type="number" required value={newEmp.baseSalary} onChange={(e)=>setNewEmp({...newEmp, baseSalary: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-mono font-bold text-blue-600" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">伙食津貼 (NT$)</label>
                                            <input type="number" value={newEmp.mealAllowance} onChange={(e)=>setNewEmp({...newEmp, mealAllowance: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-mono" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">職務津貼 (NT$)</label>
                                            <input type="number" value={newEmp.positionAllowance} onChange={(e)=>setNewEmp({...newEmp, positionAllowance: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-mono" />
                                        </div>
                                        <div>
                                            <label className="block font-bold text-slate-700 mb-1">勞保投保級距 (NT$)</label>
                                            <input type="number" value={newEmp.laborGrade} onChange={(e)=>setNewEmp({...newEmp, laborGrade: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-mono" />
                                        </div>
                                        <div className="col-span-2">
                                            <label className="block font-bold text-slate-700 mb-1">轉帳銀行帳號</label>
                                            <input type="text" placeholder="例如: 822-123456789" value={newEmp.bankAccount} onChange={(e)=>setNewEmp({...newEmp, bankAccount: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg font-mono" />
                                        </div>
                                    </div>
                                    <div className="pt-4 border-t border-slate-200 flex justify-end gap-3">
                                        <button type="button" onClick={() => setShowAddModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 font-semibold rounded-lg">取消</button>
                                        <button type="submit" className="px-6 py-2 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-lg shadow-md">確認新增</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* 模態視窗 2：確認刪除 Modal */}
                    {showDeleteModal && empToDelete && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200 p-6 space-y-4 text-center">
                                <div className="w-12 h-12 bg-rose-100 text-rose-600 rounded-full flex items-center justify-center mx-auto text-xl">
                                    <i className="fa-solid fa-triangle-exclamation"></i>
                                </div>
                                <h3 className="text-base font-bold text-slate-800">確定要刪除該位員工？</h3>
                                <p className="text-xs text-slate-500">
                                    您即將刪除 <span className="font-bold text-slate-800">{empToDelete.name} ({empToDelete.id})</span> 的個人資料與薪資明細。此操作無法復原。
                                </p>
                                <div className="pt-4 flex justify-center gap-3">
                                    <button onClick={() => setShowDeleteModal(false)} className="px-4 py-2 bg-slate-100 text-slate-600 text-xs font-semibold rounded-lg">取消</button>
                                    <button onClick={confirmDeleteEmployee} className="px-6 py-2 bg-rose-600 hover:bg-rose-700 text-white text-xs font-semibold rounded-lg shadow-md">確認刪除</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
