        function calculatePayroll(emp, config = { hourlyDivisor: 240 }) {
            // 月經常性薪資 (底薪 + 固定津貼，作為平日每小時工資額計算基礎)
            const baseSalary = Number(emp.baseSalary) || 0;
            const foodAllowance = Number(emp.foodAllowance) || 0;
            const positionAllowance = Number(emp.positionAllowance) || 0;
            const regularMonthlySalary = baseSalary + foodAllowance + positionAllowance;
            
            // 每小時工資額 (依勞動基準法：月工資總額 / 240小時)
            const divisor = Number(config.hourlyDivisor) || 240;
            const hourlyRate = regularMonthlySalary / divisor;

            // 1. 加班費計算 (依據勞動基準法第 24 條、第 39 條)
            // 平日加班前 2 小時：加給 1/3 (1.34倍)
            const otWeekday1Pay = (emp.weekdayOt1 || 0) * hourlyRate * (4 / 3);
            // 平日加班後 2 小時：加給 2/3 (1.67倍)
            const otWeekday2Pay = (emp.weekdayOt2 || 0) * hourlyRate * (5 / 3);

            // 休息日加班 (前2小時 1.34倍, 3-8小時 1.67倍, 8小時以上 2.67倍)
            let otRestDayPay = 0;
            const restHours = emp.restDayOt || 0;
            if (restHours <= 2) {
                otRestDayPay = restHours * hourlyRate * (4 / 3);
            } else if (restHours <= 8) {
                otRestDayPay = (2 * hourlyRate * (4 / 3)) + ((restHours - 2) * hourlyRate * (5 / 3));
            } else {
                otRestDayPay = (2 * hourlyRate * (4 / 3)) + (6 * hourlyRate * (5 / 3)) + ((restHours - 8) * hourlyRate * (8 / 3));
            }

            // 國定假日 / 例假日加班 (勞基法第 39 條：8小時內加倍發給 1.0 倍)
            const otHolidayPay = (emp.holidayOt || 0) * hourlyRate * 1.0;

            const totalOtPay = Math.round(otWeekday1Pay + otWeekday2Pay + otRestDayPay + otHolidayPay);

            // 2. 請假扣款計算 (依據勞工請假規則)
            // 事假：不給付工資 (扣除 100% 時薪)
            const personalLeaveDeduction = (emp.personalLeave || 0) * hourlyRate * 1.0;
            // 普通傷病假：工資折半發給 (扣除 50% 時薪)
            const sickLeaveDeduction = (emp.sickLeave || 0) * hourlyRate * 0.5;
            // 生理假：工資折半發給 (扣除 50% 時薪)
            const menstrualLeaveDeduction = (emp.menstrualLeave || 0) * hourlyRate * 0.5;

            const totalLeaveDeduction = Math.round(personalLeaveDeduction + sickLeaveDeduction + menstrualLeaveDeduction);

            // 3. 應發合計 (Gross Earnings)
            const bonus = Number(emp.bonus) || 0;
            const totalEarnings = regularMonthlySalary + bonus + totalOtPay;

            // 4. 應扣合計 (Total Deductions)
            const laborIns = Number(emp.laborIns) || 0;
            const healthIns = Number(emp.healthIns) || 0;
            const tax = Number(emp.tax) || 0;
            const totalDeductions = laborIns + healthIns + tax + totalLeaveDeduction;

            // 5. 實發薪資淨額 (Net Pay)
            const netPay = totalEarnings - totalDeductions;

            // 6. 雇主法定提繳勞退 6% (僅於薪資單公告揭露，非員工個人薪資扣額)
            const pensionEmployerContribution = Math.round(regularMonthlySalary * 0.06);

            return {
                hourlyRate: Math.round(hourlyRate * 100) / 100,
                regularMonthlySalary,
                otWeekday1Pay: Math.round(otWeekday1Pay),
                otWeekday2Pay: Math.round(otWeekday2Pay),
                otRestDayPay: Math.round(otRestDayPay),
                otHolidayPay: Math.round(otHolidayPay),
                totalOtPay,
                personalLeaveDeduction: Math.round(personalLeaveDeduction),
                sickLeaveDeduction: Math.round(sickLeaveDeduction),
                menstrualLeaveDeduction: Math.round(menstrualLeaveDeduction),
                totalLeaveDeduction,
                totalEarnings,
                totalDeductions,
                netPay,
                pensionEmployerContribution
            };
        }

            // CSV Parser for Attendance Log & Employee Master File
            const handleFileUpload = (e) => {
                const file = e.target.files[0];

                Papa.parse(file, {

                    skipEmptyLines: true,
                    complete: (results) => {

                            return;
                        }

                        const firstRow = parsedData[0];
                        const isEventLogFormat = ("類別" in firstRow || "項目" in firstRow) && "時數" in firstRow;

                        if (isEventLogFormat) {
                            const empMap = {};

                            });

                                const item = (row["項目"] || "").trim();
                                const hours = parseFloat(row["時數"]) || 0;
                                const status = (row["狀態"] || "已核准").trim();

                                if (status.includes("駁回") || status.includes("撤銷")) return;

                                if (!empMap[id]) {
                                    empMap[id] = {

                                        tax: 0
                                    };
                                }

                                if (type.includes("請假") || item.includes("假")) {
                                    if (item.includes("事假")) empMap[id].personalLeave += hours;
                                    else if (item.includes("病假")) empMap[id].sickLeave += hours;
                                    else if (item.includes("生理假")) empMap[id].menstrualLeave += hours;
                                    else if (item.includes("特休")) empMap[id].specialLeave += hours;
                                } else if (type.includes("加班") || item.includes("加班")) {
                                    if (item.includes("前2") || item.includes("1.34")) empMap[id].weekdayOt1 += hours;
                                    else if (item.includes("後2") || item.includes("1.67")) empMap[id].weekdayOt2 += hours;
                                    else if (item.includes("休息日")) empMap[id].restDayOt += hours;
                                    else if (item.includes("國定") || item.includes("例假")) empMap[id].holidayOt += hours;
                                }
                            });

                                        }
                                    }
                                    return 0;
                                };

                                    for (let k of keys) {

                                };

                                    name: getStr(["姓名", "員工姓名", "Name"], `員工${index + 1}`),
                                    department: getStr(["部門", "課別", "Department"], "設計部"),
                                    title: getStr(["職稱", "職位", "Title"], "專員"),
                                    email: getStr(["Email", "信箱"], `user${index+1}@sketchdesign.tw`),

                                    restDayOt: getNum(["休息日加班", "休息日加班時數", "休息日時數"]),
                                    holidayOt: getNum(["國定假日加班", "例假日加班", "國定假日時數"]),

                                            <ul className="list-disc pl-4 space-y-1 text-slate-600">
                                                <li><strong className="text-slate-800">平日延長工時前 2 小時：</strong> 按平日每小時工資額加給 <span className="font-mono font-bold text-amber-600">1.34 倍 (4/3)</span>。</li>
                                                <li><strong className="text-slate-800">平日延長工時第 3-4 小時：</strong> 按平日每小時工資額加給 <span className="font-mono font-bold text-amber-600">1.67 倍 (5/3)</span>。</li>
                                                <li><strong className="text-slate-800">休息日加班前 2 小時：</strong> 按平日每小時工資額加給 1.34 倍，第 3-8 小時加給 1.67 倍。</li>
                                            </ul>
                                        </div>

                                        <div className="p-4 bg-slate-50 rounded-xl border border-slate-200 space-y-2">
                                            <h4 className="font-bold text-slate-900 text-sm">二、請假扣款原則 (勞工請假規則)</h4>
                                            <ul className="list-disc pl-4 space-y-1 text-slate-600">
                                                <li><strong className="text-slate-800">事假：</strong> 一年內不得超過14日，不給付工資（扣除 100% 時薪）。</li>
                                                <li><strong className="text-slate-800">普通傷病假：</strong> 未住院一年內不得超過30日，工資折半發給（扣除 50% 時薪）。</li>
                                                <li><strong className="text-slate-800">生理假：</strong> 每月得請1日，全年不併入病假計算，工資折半發給。</li>
                                                <li><strong className="text-slate-800">特別休假 (特休)：</strong> 工資照給，不得扣款。</li>
                                            </ul>
                                        </div>
                                    </div>
                                </div>
                            )}

                        </main>
                    </div>

                    {/* Edit Employee Modal UI */}
                    {editingEmp && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-2xl rounded-2xl shadow-2xl overflow-hidden border border-slate-200 animate-in fade-in zoom-in-95 duration-200">
                                <div className="p-5 bg-slate-900 text-white flex justify-between items-center">
                                    <h3 className="font-bold text-sm">編輯員工資料與薪資項目 - {editingEmp.name}</h3>
                                    <button 
                                        onClick={() => setEditingEmp(null)}
                                        className="text-slate-400 hover:text-white font-bold text-sm"
                                    >
                                        ✕
                                    </button>
                                </div>

                                <form onSubmit={handleSaveEmployee} className="p-6 space-y-4 max-h-[80vh] overflow-y-auto text-xs">
                                    <div className="grid grid-cols-2 gap-4">
                                        <div>
                                            <label className="block text-slate-600 mb-1 font-medium">員工姓名</label>
                                            <input
                                                type="text"
                                                value={editingEmp.name}
                                                onChange={(e) => setEditingEmp({ ...editingEmp, name: e.target.value })}
                                                className="w-full p-2 border border-slate-300 rounded-lg"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-600 mb-1 font-medium">部門代碼</label>
                                            <input
                                                type="text"
                                                value={editingEmp.department}
                                                onChange={(e) => setEditingEmp({ ...editingEmp, department: e.target.value })}
                                                className="w-full p-2 border border-slate-300 rounded-lg"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-600 mb-1 font-medium">基本月薪 (底薪)</label>
                                            <input
                                                type="number"
                                                value={editingEmp.baseSalary}
                                                onChange={(e) => setEditingEmp({ ...editingEmp, baseSalary: Number(e.target.value) })}
                                                className="w-full p-2 border border-slate-300 rounded-lg font-mono"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-600 mb-1 font-medium">伙食津貼</label>
                                            <input
                                                type="number"
                                                value={editingEmp.foodAllowance}
                                                onChange={(e) => setEditingEmp({ ...editingEmp, foodAllowance: Number(e.target.value) })}
                                                className="w-full p-2 border border-slate-300 rounded-lg font-mono"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-600 mb-1 font-medium">事假時數 (扣全薪)</label>
                                            <input
                                                type="number"
                                                value={editingEmp.personalLeave}
                                                onChange={(e) => setEditingEmp({ ...editingEmp, personalLeave: Number(e.target.value) })}
                                                className="w-full p-2 border border-slate-300 rounded-lg font-mono text-rose-600"
                                            />
                                        </div>
                                        <div>
                                            <label className="block text-slate-600 mb-1 font-medium">病假時數 (扣半薪)</label>
                                            <input
                                                type="number"
                                                value={editingEmp.sickLeave}
                                                onChange={(e) => setEditingEmp({ ...editingEmp, sickLeave: Number(e.target.value) })}
                                                className="w-full p-2 border border-slate-300 rounded-lg font-mono text-rose-600"
                                            />
                                        </div>
                                    </div>

                                    <div className="pt-4 border-t border-slate-200 flex justify-end space-x-2">
                                        <button
                                            type="button"
                                            onClick={() => setEditingEmp(null)}
                                            className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg font-semibold"
                                        >
                                            取消
                                        </button>
                                        <button
                                            type="submit"
                                            className="px-5 py-2 bg-sky-600 hover:bg-sky-500 text-white rounded-lg font-bold shadow"
                                        >
                                            儲存更新
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
