<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>草圖設計工作室 - 人事薪資與差勤管理系統 (勞基法合規版)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (XLSX) 庫，用於讀取與解析 Excel 檔案 -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f8fafc;
        }
        @media print {
            .no-print { display: none !important; }
            .print-only { display: block !important; }
            body { background-color: white !important; font-size: 12pt; }
            .print-page { page-break-after: always; margin: 0; padding: 1.5cm; }
            .shadow-sm, .shadow-md, .shadow-lg, .shadow-xl { box-shadow: none !important; }
            .border { border-color: #cbd5e1 !important; }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // 勞健保分級表自動對照函數
        const laborGrades = [27470, 27600, 28800, 30300, 31800, 33300, 34800, 36300, 38200, 40100, 42000, 43900, 45800];
        const healthGrades = [27470, 27600, 28800, 30300, 31800, 33300, 34800, 36300, 38200, 40100, 42000, 43900, 45800, 48200, 50600, 53000, 55400, 57800, 60400, 63800, 66800, 69800, 72800, 76500, 80200, 83900, 87600, 92100, 96600, 101100, 105600, 110100, 114600, 119100, 123600, 128100, 132600, 137100, 141600, 146100, 150000, 157000, 164000, 171000, 178000, 185000, 192000, 200000, 208000, 216000, 224000, 232000, 240000, 248000, 256000, 264000, 272000, 280000, 288000, 296000, 304000, 312000];

        const getInsuranceGrade = (salary, gradeList) => {
            const val = Number(salary) || 0;
            if (val <= gradeList[0]) return gradeList[0];
            for (let i = 0; i < gradeList.length; i++) {
                if (val <= gradeList[i]) return gradeList[i];
            }
            return gradeList[gradeList.length - 1];
        };

        // 預載員工資料（三節禮金修正為1000元，生日禮金1000元）
        const initialEmployees = [
            { id: "T9014", name: "姜美辰", idNumber: "A223456789", birthDate: "1992-05-20", dept: "草圖設計部", title: "專案設計師", baseSalary: 45000, mealAllowance: 3000, positionAllowance: 2000, bonus: 2000, festivalBonus: 1000, birthdayBonus: 1000, laborGrade: 45800, healthGrade: 50600, bankAccount: "822123456789012", onboardDate: "2024-03-15" },
            { id: "T701",  name: "戴葳葳", idNumber: "B298765432", birthDate: "1988-09-12", dept: "草圖設計部", title: "資深設計師", baseSalary: 50000, mealAllowance: 3000, positionAllowance: 5000, bonus: 3000, festivalBonus: 1000, birthdayBonus: 1000, laborGrade: 45800, healthGrade: 60400, bankAccount: "013987654321098", onboardDate: "2022-09-01" },
            { id: "T801",  name: "姚芳庭", idNumber: "C145554443", birthDate: "1990-08-05", dept: "營運管理部", title: "專案經理",   baseSalary: 48000, mealAllowance: 3000, positionAllowance: 4000, bonus: 2500, festivalBonus: 1000, birthdayBonus: 1000, laborGrade: 45800, healthGrade: 55400, bankAccount: "808555444333222", onboardDate: "2023-01-10" },
            { id: "T901",  name: "林恩希", idNumber: "D211122233", birthDate: "1995-02-14", dept: "多媒體設計部", title: "視覺設計師", baseSalary: 42000, mealAllowance: 3000, positionAllowance: 2000, bonus: 1500, festivalBonus: 1000, birthdayBonus: 1000, laborGrade: 45800, healthGrade: 48200, bankAccount: "004111222333444", onboardDate: "2024-06-01" },
            { id: "T914",  name: "莊凱鈞", idNumber: "E177788899", birthDate: "1993-09-30", dept: "資訊技術部", title: "系統工程師", baseSalary: 46000, mealAllowance: 3000, positionAllowance: 3000, bonus: 2000, festivalBonus: 1000, birthdayBonus: 1000, laborGrade: 45800, healthGrade: 53000, bankAccount: "012777888999000", onboardDate: "2024-08-16" }
        ];

        // 預載差勤紀錄
        const initialAttendanceLogs = [
            { id: 1, empId: "T701", empName: "戴葳葳", category: "請假", item: "事假", hours: 8, amount: -1667, status: "已核准", date: "2026-09-16", reason: "處理私人事務" },
            { id: 2, empId: "T9014", empName: "姜美辰", category: "加班", item: "平日加班", hours: 2, amount: 500, status: "已核准", date: "2026-09-18", reason: "專案趕工" }
        ];

        const calculateLaborInsurance = (wage) => {
            const laborRate = 0.115;
            const selfShare = 0.20;
            return Math.round(wage * laborRate * selfShare);
        };

        const calculateHealthInsurance = (wage) => {
            const healthRate = 0.0517;
            const selfShare = 0.30;
            return Math.round(wage * healthRate * selfShare);
        };

        const maskSensitiveInfo = (text, type, mode) => {
            if (!text) return "未填寫";
            if (mode === "full") return text;
            if (mode === "hidden") return "********";
            
            if (type === "bank") {
                if (text.length <= 5) return text;
                const visible = text.slice(-5);
                const masked = "*".repeat(text.length - 5);
                return `${masked}${visible}`;
            } else if (type === "id") {
                if (text.length < 5) return "*****";
                return text[0] + "*****" + text.slice(-4);
            }
            return text;
        };

        function App() {
            const [isLoggedIn, setIsLoggedIn] = useState(true);
            const [currentUser, setCurrentUser] = useState({ id: "admin", name: "系統管理員", role: "admin" });
            const [loginForm, setLoginForm] = useState({ username: "admin", password: "123" });

            const [privacyMode, setPrivacyMode] = useState("half");

            const [employees, setEmployees] = useState(initialEmployees);
            const [attendanceLogs, setAttendanceLogs] = useState(initialAttendanceLogs);
            const [currentTab, setCurrentTab] = useState("dashboard"); 
            const [selectedEmpId, setSelectedEmpId] = useState("T701");
            const [payPeriod, setPayPeriod] = useState("2026-09");
            
            const [showAddModal, setShowAddModal] = useState(false);
            const [showEditModal, setShowEditModal] = useState(false);
            const [showDeleteModal, setShowDeleteModal] = useState(false);
            const [empToDelete, setEmpToDelete] = useState(null);

            const [showLogModal, setShowLogModal] = useState(false);
            const [editingLog, setEditingLog] = useState(null);

            const [newEmp, setNewEmp] = useState({
                id: "", name: "", idNumber: "", birthDate: "1995-01-01", dept: "草圖設計部", title: "設計師",
                baseSalary: 42000, mealAllowance: 3000, positionAllowance: 2000, bonus: 0, festivalBonus: 1000, birthdayBonus: 1000,
                laborGrade: 45800, healthGrade: 48200, bankAccount: "", onboardDate: "2026-09-01"
            });

            useEffect(() => {
                const totalFixedSalary = (Number(newEmp.baseSalary) || 0) + (Number(newEmp.mealAllowance) || 0) + (Number(newEmp.positionAllowance) || 0);
                setNewEmp(prev => ({
                    ...prev,
                    laborGrade: getInsuranceGrade(totalFixedSalary, laborGrades),
                    healthGrade: getInsuranceGrade(totalFixedSalary, healthGrades)
                }));
            }, [newEmp.baseSalary, newEmp.mealAllowance, newEmp.positionAllowance]);

            const [editEmp, setEditEmp] = useState(null);

            const handleEditSalaryChange = (field, value) => {
                if (!editEmp) return;
                const updated = { ...editEmp, [field]: value };
                const totalFixedSalary = (Number(updated.baseSalary) || 0) + (Number(updated.mealAllowance) || 0) + (Number(updated.positionAllowance) || 0);
                updated.laborGrade = getInsuranceGrade(totalFixedSalary, laborGrades);
                updated.healthGrade = getInsuranceGrade(totalFixedSalary, healthGrades);
                setEditEmp(updated);
            };

            const [company, setCompany] = useState({
                name: "草圖設計工作室",
                taxId: "83749201",
                address: "新竹市東區光復路二段100號",
                phone: "03-5712345",
                hrManager: "戴葳葳",
                payDay: "每月 1 日 (遇假日順延)",
                nextPayDate: "2026-10-01",
                baseHours: 240
            });

            const calculateSeniorityAndRaise = (onboardDateStr, baseSal) => {
                if (!onboardDateStr) return { years: 0, months: 0, totalMonths: 0, raisePeriods: 0, currentSalaryWithRaise: baseSal, raiseAmount: 0 };
                
                const onboard = new Date(onboardDateStr);
                const now = new Date(payPeriod + "-01");
                
                let diffMonths = (now.getFullYear() - onboard.getFullYear()) * 12 + (now.getMonth() - onboard.getMonth());
                if (diffMonths < 0) diffMonths = 0;

                const years = Math.floor(diffMonths / 12);
                const months = diffMonths % 12;

                const raisePeriods = Math.floor(diffMonths / 6);
                let adjustedSalary = baseSal;
                for (let i = 0; i < raisePeriods; i++) {
                    adjustedSalary = adjustedSalary * 1.015;
                }
                adjustedSalary = Math.round(adjustedSalary);
                const raiseAmount = adjustedSalary - baseSal;

                return { years, months, totalMonths: diffMonths, raisePeriods, currentSalaryWithRaise: adjustedSalary, raiseAmount };
            };

            const calculateYearEndBonus = (emp) => {
                const sen = calculateSeniorityAndRaise(emp.onboardDate, emp.baseSalary);
                const fullBase = sen.currentSalaryWithRaise + (emp.mealAllowance || 0) + (emp.positionAllowance || 0);
                
                let bonusFactor = 1.5;
                if (sen.totalMonths < 12) {
                    bonusFactor = 1.5 * (sen.totalMonths / 12);
                }
                const yearEndBonus = Math.round(fullBase * bonusFactor);
                return { ...sen, fullBase, bonusFactor: bonusFactor.toFixed(2), yearEndBonus };
            };

            const getEmpAttendanceSummary = (empId) => {
                const empLogs = attendanceLogs.filter(log => log.empId === empId && log.status === "已核准");
                let unpaidLeaveHours = 0;   
                let halfPaidLeaveHours = 0; 
                let otWeekdayHours = 0;     
                let otRestdayHours = 0;     
                let otNationalHours = 0;    

                empLogs.forEach(log => {
                    if (log.category === "請假") {
                        if (log.item === "事假" || log.item === "曠職") {
                            unpaidLeaveHours += Number(log.hours || 0);
                        } else if (log.item === "病假" || log.item === "生理假") {
                            halfPaidLeaveHours += Number(log.hours || 0);
                        }
                    } else if (log.category === "加班") {
                        if (log.item.includes("平日")) otWeekdayHours += Number(log.hours || 0);
                        else if (log.item.includes("休息日")) otRestdayHours += Number(log.hours || 0);
                        else if (log.item.includes("國定")) otNationalHours += Number(log.hours || 0);
                        else otWeekdayHours += Number(log.hours || 0);
                    }
                });

                return { unpaidLeaveHours, halfPaidLeaveHours, otWeekdayHours, otRestdayHours, otNationalHours, logs: empLogs };
            };

            // 生日月份判斷邏輯：比對 payPeriod (YYYY-MM) 與 birthDate (YYYY-MM-DD) 的月份
            const isBirthdayMonth = (birthDateStr) => {
                if (!birthDateStr || !payPeriod) return false;
                const payMonth = payPeriod.split("-")[1]; // 取得發薪月份 "09"
                const birthMonth = birthDateStr.split("-")[1]; // 取得生日月份
                return payMonth === birthMonth;
            };

            const calculateSalary = (emp) => {
                const sen = calculateSeniorityAndRaise(emp.onboardDate, emp.baseSalary);
                const currentBase = sen.currentSalaryWithRaise;

                const totalFixed = currentBase + (emp.mealAllowance || 0) + (emp.positionAllowance || 0);
                const hourlyRate = Math.round((totalFixed / 240) * 100) / 100;
                
                const att = getEmpAttendanceSummary(emp.id);

                const unpaidDeduction = Math.round(att.unpaidLeaveHours * hourlyRate);
                const halfPaidDeduction = Math.round(att.halfPaidLeaveHours * hourlyRate * 0.5);
                const totalLeaveDeduction = unpaidDeduction + halfPaidDeduction;

                const otWeekdayFee = att.otWeekdayHours <= 2 
                    ? Math.round(att.otWeekdayHours * hourlyRate * 1.34)
                    : Math.round(2 * hourlyRate * 1.34 + (att.otWeekdayHours - 2) * hourlyRate * 1.67);

                const otRestdayFee = att.otRestdayHours <= 2
                    ? Math.round(att.otRestdayHours * hourlyRate * 1.34)
                    : Math.round(2 * hourlyRate * 1.34 + (att.otRestdayHours - 2) * hourlyRate * 1.67);

                const otNationalFee = Math.round(att.otNationalHours * hourlyRate * 2.0);

                const totalOvertimeFee = otWeekdayFee + otRestdayFee + otNationalFee;
                
                const festivalBonus = emp.festivalBonus || 1000;
                
                // 生日禮金計算：若發薪月份為生日月份，自動加發 1,000 元生日禮金
                const isBirthday = isBirthdayMonth(emp.birthDate);
                const activeBirthdayBonus = isBirthday ? (emp.birthdayBonus || 1000) : 0;

                const totalGross = totalFixed + (emp.bonus || 0) + festivalBonus + activeBirthdayBonus + totalOvertimeFee;

                const laborSelf = calculateLaborInsurance(emp.laborGrade);
                const healthSelf = calculateHealthInsurance(emp.healthGrade);
                const totalDeductions = laborSelf + healthSelf + totalLeaveDeduction;

                const netPay = totalGross - totalDeductions;
                const laborPensionCompany = Math.round(emp.laborGrade * 0.06);

                const yearEndCalc = calculateYearEndBonus(emp);

                return {
                    sen,
                    currentBase,
                    hourlyRate,
                    totalFixed,
                    festivalBonus,
                    isBirthday,
                    activeBirthdayBonus,
                    unpaidDeduction,
                    halfPaidDeduction,
                    totalLeaveDeduction,
                    otWeekdayFee,
                    otRestdayFee,
                    otNationalFee,
                    totalOvertimeFee,
                    totalGross,
                    laborSelf,
                    healthSelf,
                    totalDeductions,
                    netPay,
                    laborPensionCompany,
                    yearEndCalc,
                    att
                };
            };

            const salarySummary = useMemo(() => {
                let grossTotal = 0;
                let netTotal = 0;
                let otTotal = 0;
                let leaveDeductionTotal = 0;

                employees.forEach(emp => {
                    const calc = calculateSalary(emp);
                    grossTotal += calc.totalGross;
                    netTotal += calc.netPay;
                    otTotal += calc.totalOvertimeFee;
                    leaveDeductionTotal += calc.totalLeaveDeduction;
                });

                return { grossTotal, netTotal, otTotal, leaveDeductionTotal, empCount: employees.length };
            }, [employees, attendanceLogs, payPeriod]);

            // Excel 新進員工資料匯入處理
            const handleEmployeeExcelUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = new Uint8Array(event.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        const firstSheetName = workbook.SheetNames[0];
                        const worksheet = workbook.Sheets[firstSheetName];
                        
                        const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, raw: false });

                        if (!rows || rows.length <= 2) {
                            alert("Excel 檔案未包含有效的申請資料（資料需從第 3 列開始填寫）！");
                            return;
                        }

                        let importedCount = 0;
                        const importedEmployees = [];

                        for (let i = 2; i < rows.length; i++) {
                            const row = rows[i];
                            if (!row || row.length === 0) continue;

                            const idNumber = row[1] ? String(row[1]).trim() : "";
                            const name = row[2] ? String(row[2]).trim() : "";

                            if (idNumber && name) {
                                let birthDate = row[5] ? String(row[5]).trim().replace(/\//g, '-') : "1995-01-01";
                                const autoId = `T${915 + importedCount}`;

                                const baseSalary = 42000;
                                const mealAllowance = 3000;
                                const positionAllowance = 2000;
                                const totalFixedSalary = baseSalary + mealAllowance + positionAllowance;

                                importedEmployees.push({
                                    id: autoId,
                                    name: name,
                                    englishName: row[3] ? String(row[3]).trim() : "",
                                    idNumber: idNumber,
                                    nationality: row[4] ? String(row[4]).trim() : "中華民國",
                                    birthDate: birthDate,
                                    phone: row[6] ? String(row[6]).trim() : "",
                                    email: row[7] ? String(row[7]).trim() : "",
                                    dept: "草圖設計部",
                                    title: row[8] ? String(row[8]).trim() : "專案設計師",
                                    emergencyContact: row[9] ? String(row[9]).trim() : "",
                                    emergencyPhone: row[10] ? String(row[10]).trim() : "",
                                    baseSalary: baseSalary,
                                    mealAllowance: mealAllowance,
                                    positionAllowance: positionAllowance,
                                    bonus: 0,
                                    festivalBonus: 1000,
                                    birthdayBonus: 1000,
                                    laborGrade: getInsuranceGrade(totalFixedSalary, laborGrades),
                                    healthGrade: getInsuranceGrade(totalFixedSalary, healthGrades),
                                    bankAccount: "700" + Math.floor(10000000000 + Math.random() * 90000000000),
                                    onboardDate: "2026-09-01"
                                });
                                importedCount++;
                            }
                        }

                        if (importedEmployees.length > 0) {
                            setEmployees(prev => {
                                const existingIds = new Set(prev.map(e => e.idNumber));
                                const filteredNew = importedEmployees.filter(e => !existingIds.has(e.idNumber));
                                return [...prev, ...filteredNew];
                            });
                            alert(`成功從第 3 列起匯入 ${importedCount} 筆新進員工資料！`);
                        } else {
                            alert("未讀取到有效的員工資料，請確認第 3 列起之「身分證號」與「姓名」已填寫。");
                        }
                    } catch (err) {
                        console.error(err);
                        alert("解析 Excel 檔案發生錯誤，請確保上傳有效的 .xlsx 或 .xls 檔案！");
                    }
                };
                reader.readAsArrayBuffer(file);
                e.target.value = "";
            };

            // CSV 差勤上傳處理
            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (event) => {
                    const text = event.target.result;
                    const lines = text.split(/\r\n|\n/);
                    if (lines.length < 2) return;

                    const newLogs = [];
                    for (let i = 1; i < lines.length; i++) {
                        const line = lines[i].trim();
                        if (!line) continue;

                        const cols = line.split(',').map(c => c.replace(/^["']|["']$/g, '').trim());
                        if (cols.length >= 6) {
                            const [empId, empName, category, item, hours, reason, status] = cols;
                            newLogs.push({
                                id: Date.now() + i,
                                empId: empId || "T701",
                                empName: empName || "未命名",
                                category: category || "請假",
                                item: item || "事假",
                                hours: parseFloat(hours) || 0,
                                amount: 0,
                                status: status || "已核准",
                                reason: reason || "",
                                date: "2026-09-18"
                            });
                        }
                    }

                    if (newLogs.length > 0) {
                        setAttendanceLogs(prev => [...prev, ...newLogs]);
                        alert(`成功匯入 ${newLogs.length} 筆差勤/加班資料！已自動納入薪資試算。`);
                    } else {
                        alert("匯入失敗：請確認 CSV 檔案格式正確。");
                    }
                };
                reader.readAsText(file, 'UTF-8');
            };

            const handleSaveLog = (e) => {
                e.preventDefault();
                if (!editingLog) return;

                if (editingLog.id) {
                    setAttendanceLogs(attendanceLogs.map(l => l.id === editingLog.id ? editingLog : l));
                } else {
                    const newEntry = { ...editingLog, id: Date.now() };
                    setAttendanceLogs([...attendanceLogs, newEntry]);
                }
                setShowLogModal(false);
                setEditingLog(null);
            };

            const handleDeleteLog = (id) => {
                if (window.confirm("確定要刪除此筆差勤紀錄嗎？")) {
                    setAttendanceLogs(attendanceLogs.filter(l => l.id !== id));
                }
            };

            const handleAddEmployee = (e) => {
                e.preventDefault();
                if (!newEmp.id.trim() || !newEmp.name.trim()) {
                    alert("請填寫工號與姓名！");
                    return;
                }
                if (employees.some(emp => emp.id === newEmp.id.trim())) {
                    alert(`工號 ${newEmp.id.trim()} 已存在，請使用不同工號！`);
                    return;
                }

                const empObj = {
                    ...newEmp,
                    id: newEmp.id.trim(),
                    baseSalary: Number(newEmp.baseSalary) || 0,
                    mealAllowance: Number(newEmp.mealAllowance) || 0,
                    positionAllowance: Number(newEmp.positionAllowance) || 0,
                    bonus: Number(newEmp.bonus) || 0,
                    festivalBonus: Number(newEmp.festivalBonus) || 1000,
                    birthdayBonus: Number(newEmp.birthdayBonus) || 1000,
                    laborGrade: Number(newEmp.laborGrade),
                    healthGrade: Number(newEmp.healthGrade)
                };

                setEmployees([...employees, empObj]);
                setShowAddModal(false);
                alert(`已成功新增員工：${empObj.name} (${empObj.id})`);
            };

            const handleOpenEditModal = (emp) => {
                setEditEmp({ ...emp, originalId: emp.id, festivalBonus: emp.festivalBonus || 1000, birthdayBonus: emp.birthdayBonus || 1000 });
                setShowEditModal(true);
            };

            const handleUpdateEmployee = (e) => {
                e.preventDefault();
                if (!editEmp) return;

                const newId = editEmp.id ? editEmp.id.trim() : "";
                if (!newId) {
                    alert("員工工號不可為空！");
                    return;
                }

                if (newId !== editEmp.originalId && employees.some(emp => emp.id === newId)) {
                    alert(`工號 ${newId} 已被其他員工使用，請更換工號！`);
                    return;
                }

                const updatedObj = {
                    ...editEmp,
                    id: newId,
                    baseSalary: Number(editEmp.baseSalary) || 0,
                    mealAllowance: Number(editEmp.mealAllowance) || 0,
                    positionAllowance: Number(editEmp.positionAllowance) || 0,
                    bonus: Number(editEmp.bonus) || 0,
                    festivalBonus: Number(editEmp.festivalBonus) || 1000,
                    birthdayBonus: Number(editEmp.birthdayBonus) || 1000,
                    laborGrade: Number(editEmp.laborGrade),
                    healthGrade: Number(editEmp.healthGrade)
                };

                const oldId = editEmp.originalId;
                delete updatedObj.originalId;

                setEmployees(employees.map(emp => emp.id === oldId ? updatedObj : emp));

                setAttendanceLogs(attendanceLogs.map(log => 
                    log.empId === oldId ? { ...log, empId: newId, empName: updatedObj.name } : log
                ));

                if (selectedEmpId === oldId) {
                    setSelectedEmpId(newId);
                }

                setShowEditModal(false);
                setEditEmp(null);
                alert(`已成功更新 ${updatedObj.name} 的基本資料與工號 (${newId})！`);
            };

            const confirmDeleteEmployee = () => {
                if (!empToDelete) return;
                setEmployees(employees.filter(emp => emp.id !== empToDelete.id));
                if (selectedEmpId === empToDelete.id) {
                    const remaining = employees.filter(emp => emp.id !== empToDelete.id);

                                <div>

                                            </div>

                                                                </div>
                                                            </td>

                                            value={editingLog.reason} 
                                            onChange={(e) => setEditingLog({ ...editingLog, reason: e.target.value })}
                                            className="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg" 
                                            placeholder="請輸入請假或加班原因"
                                        />
                                    </div>
                                    <div className="pt-4 border-t border-slate-200 flex justify-end gap-3">
                                        <button type="button" onClick={() => setShowLogModal(false)} className="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold rounded-xl">取消</button>
                                        <button type="submit" className="px-5 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold rounded-xl shadow-md">儲存紀錄</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
