<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>員工管理系統-登入薪資單版</title>
<style>
:root{--m:#1f4e79;--a:#2f75b5;--bg:#f4f7fb;--line:#d9e2ec;--red:#c0392b;--ok:#0f766e;--gray:#64748b;--warn:#b45309}*{box-sizing:border-box}body{font-family:"Microsoft JhengHei",Arial,sans-serif;margin:0;background:var(--bg);color:#243447}header{background:linear-gradient(135deg,var(--m),var(--a));color:white;padding:20px}header h1{margin:0;font-size:25px}header p{margin:6px 0}.topbar{display:flex;gap:8px;justify-content:flex-end;align-items:center;flex-wrap:wrap}.topbar button{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35)}main{max-width:1220px;margin:18px auto;padding:0 14px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 5px 18px rgba(31,78,121,.08)}h2{font-size:19px;margin:0 0 12px;color:var(--m);border-left:5px solid var(--a);padding-left:10px}.grid{display:grid;grid-template-columns:repeat(4,minmax(150px,1fr));gap:12px}label{font-size:13px;font-weight:700;color:#344054;display:block;margin-bottom:5px}input,select,textarea{width:100%;padding:9px;border:1px solid #cfd8e3;border-radius:9px;font-size:14px}textarea{min-height:44px}.full{grid-column:1/-1}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:0;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700;background:var(--a);color:white}button.ok{background:var(--ok)}button.danger{background:var(--red)}button.secondary{background:var(--gray)}button.warn{background:var(--warn)}table{width:100%;border-collapse:collapse;background:white}th,td{border-bottom:1px solid var(--line);padding:9px;text-align:left;font-size:13px;vertical-align:middle}th{background:#eaf2f8;color:#17395c;white-space:nowrap}.num{text-align:right}.center{text-align:center}.small{font-size:12px;color:#667085}.pill{display:inline-block;padding:3px 8px;border-radius:999px;background:#eef6ff;color:var(--m);font-size:12px;font-weight:700}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:10px}.metric{background:#f8fbfd;border:1px solid var(--line);border-radius:12px;padding:10px}.metric b{display:block;color:var(--m);font-size:13px}.metric span{font-size:16px;font-weight:800}.login{position:fixed;inset:0;background:linear-gradient(135deg,#1f4e79,#2f75b5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:9999}.loginbox{width:min(430px,100%);background:white;border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.loginbox h1{margin:0 0 6px;color:var(--m);font-size:24px}.err{color:var(--red);font-weight:700;min-height:20px;font-size:13px;margin-top:8px}.hidden{display:none!important}.notice{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:12px;padding:10px;margin-top:10px;font-size:13px}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.grid,.metrics{grid-template-columns:1fr}table{display:block;overflow-x:auto;white-space:nowrap}.hide-mobile{display:none}}
</style></head>
<body>
<div id="loginScreen" class="login"><div class="loginbox"><h1>員工管理系統登入</h1><p class="small">登入後才能新增、編輯、刪除、匯出薪資資料。</p><label>帳號</label><input id="loginUser" placeholder="預設：admin"><label style="margin-top:10px">密碼</label><input id="loginPass" type="password" placeholder="預設：admin123" onkeydown="if(event.key==='Enter')login()"><div class="btns"><button class="ok" onclick="login()">登入</button><button class="secondary" onclick="togglePasswordBox()">修改密碼</button></div><div id="loginMsg" class="err"></div><p class="small">首次使用建議先用 admin / admin123 登入後修改密碼。</p><div id="pwdBox" class="hidden" style="border-top:1px solid #d9e2ec;margin-top:12px;padding-top:12px"><label>目前密碼</label><input id="oldPass" type="password"><label style="margin-top:10px">新密碼</label><input id="newPass" type="password"><label style="margin-top:10px">確認新密碼</label><input id="newPass2" type="password"><div class="btns"><button onclick="changePassword()">確認修改</button><button class="secondary" onclick="togglePasswordBox(false)">取消</button></div></div></div></div>
<header><h1>員工資料管理系統（登入薪資單版）</h1><p>單人單機使用：員工資料、薪資條件、薪資單產生、列印與匯出 HTML / CSV。</p><div class="topbar"><span id="loginStatus">尚未登入</span><button onclick="showPwdAfterLogin()">修改密碼</button><button onclick="logout()">登出</button></div></header>
<main>
<section class="card"><h2>員工資料 / 薪資條件</h2><input type="hidden" id="editIndex"><div class="grid"><div><label>員工編號</label><input id="empid" placeholder="E001"></div><div><label>姓名</label><input id="name"></div><div><label>部門</label><input id="dept"></div><div><label>職稱</label><input id="position"></div><div><label>到職日</label><input id="startDate" type="date" oninput="preview()"></div><div><label>薪資類型</label><select id="salaryType" onchange="preview()"><option>月薪</option><option>日薪</option><option>時薪</option></select></div><div><label>薪資金額</label><input id="salaryAmount" type="number" min="0" oninput="preview()"></div><div><label>每月發薪日</label><select id="payDay" onchange="preview()"></select></div><div><label>每日標準工時</label><input id="workHours" type="number" value="8" oninput="preview()"></div><div><label>固定津貼</label><input id="allowance" type="number" value="0" oninput="preview()"></div><div><label>預設每月扣款</label><input id="deduction" type="number" value="0" oninput="preview()"></div><div><label>加班費率 / 小時</label><input id="overtimeRate" type="number" value="0"></div><div><label>狀態</label><select id="status"><option>在職</option><option>試用期</option><option>離職</option><option>留職停薪</option></select></div><div><label>電話</label><input id="phone"></div><div><label>Email</label><input id="email"></div><div><label>銀行帳號</label><input id="bankAccount"></div><div class="full"><label>薪資條件備註</label><textarea id="salaryNote"></textarea></div></div><div class="metrics"><div class="metric"><b>下次薪資日</b><span id="nextPayDate">-</span></div><div class="metric"><b>到職當月計薪天數</b><span id="firstMonthDays">-</span></div><div class="metric"><b>到職當月預估薪資</b><span id="firstMonthPay">-</span></div><div class="metric"><b>每月固定薪資估算</b><span id="monthlyPay">-</span></div></div><div class="btns"><button class="ok" onclick="saveEmp()">儲存資料</button><button class="secondary" onclick="clearForm()">清空</button><button onclick="exportCSV()">匯出 CSV</button><button class="danger" onclick="clearAll()">清除全部資料</button></div><div class="notice">注意：單機版登入是防止一般人誤開操作，資料仍存於本機瀏覽器，不等同正式伺服器資安。</div></section>
<section class="card"><h2>薪資單產生設定</h2><div class="grid"><div><label>薪資月份</label><input id="payMonth" type="month"></div><div><label>本月出勤天數</label><input id="payWorkDays" type="number" value="22"></div><div><label>本月加班時數</label><input id="payOvertimeHours" type="number" value="0"></div><div><label>本月獎金/其他加給</label><input id="payBonus" type="number" value="0"></div><div><label>請假/事病假扣款</label><input id="payLeaveDeduction" type="number" value="0"></div><div><label>勞健保等其他扣款</label><input id="payOtherDeduction" type="number" value="0"></div><div><label>公司名稱</label><input id="companyName" value="公司名稱"></div><div><label>薪資單備註</label><input id="payslipNote" placeholder="薪資已匯入指定帳戶"></div></div><div class="btns"><button class="warn" onclick="exportAllPayslips()">匯出全部員工薪資單 HTML</button></div></section>
<section class="card"><h2>員工清單</h2><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><input id="keyword" placeholder="搜尋姓名、員編、部門、職稱" oninput="render()" style="max-width:340px"><span id="countInfo" class="pill">0 筆資料</span></div><div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>員編</th><th>姓名</th><th>部門</th><th class="hide-mobile">職稱</th><th>到職日</th><th>薪資條件</th><th>發薪日</th><th>下次薪資日</th><th class="num">月薪估算</th><th>狀態</th><th>操作</th></tr></thead><tbody id="tb"></tbody></table></div></section>
</main>
<script>
const $=id=>document.getElementById(id), AUTH='ems_auth_v2', SESSION='ems_session_v2', DATA='ems_employee_salary_login';let data=JSON.parse(localStorage.getItem(DATA)||localStorage.getItem('employees_salary_slip')||localStorage.getItem('employees_v2')||'[]');
for(let i=1;i<=31;i++){let o=document.createElement('option');o.value=i;o.textContent=i+' 日';if(i==5)o.selected=true;$('payDay').appendChild(o)}
(function(){let d=new Date();$('payMonth').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')})();
function auth(){let a=JSON.parse(localStorage.getItem(AUTH)||'null');if(!a){a={user:'admin',pass:'admin123'};localStorage.setItem(AUTH,JSON.stringify(a))}return a}function logged(){return sessionStorage.getItem(SESSION)==='1'}function updateLogin(){let ok=logged();$('loginScreen').classList.toggle('hidden',ok);$('loginStatus').textContent=ok?'已登入：admin':'尚未登入'}function login(){let a=auth();$('loginMsg').textContent='';if($('loginUser').value.trim()===a.user && $('loginPass').value===a.pass){sessionStorage.setItem(SESSION,'1');$('loginPass').value='';updateLogin()}else $('loginMsg').textContent='帳號或密碼錯誤'}function logout(){sessionStorage.removeItem(SESSION);updateLogin()}function needLogin(){if(!logged()){alert('請先登入後再操作');updateLogin();return false}return true}function togglePasswordBox(show){$('pwdBox').classList.toggle('hidden',show===false?true:!$('pwdBox').classList.contains('hidden')?true:false)}function showPwdAfterLogin(){if(!needLogin())return;togglePasswordBox(true);$('loginScreen').classList.remove('hidden')}
function changePassword(){let a=auth(), old=$('oldPass').value, np=$('newPass').value, np2=$('newPass2').value;if(old!==a.pass){$('loginMsg').textContent='目前密碼不正確';return}if(np.length<6){$('loginMsg').textContent='新密碼至少 6 碼';return}if(np!==np2){$('loginMsg').textContent='兩次新密碼不一致';return}a.pass=np;localStorage.setItem(AUTH,JSON.stringify(a));$('loginMsg').textContent='密碼已修改，請用新密碼登入';['oldPass','newPass','newPass2'].forEach(id=>$(id).value='');}
function pad(n){return String(n).padStart(2,'0')}function fmt(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function dim(y,m){return new Date(y,m+1,0).getDate()}function n(v){return Number(v||0)}function money(v){return isFinite(v)?'NT$ '+Math.round(v).toLocaleString('zh-TW'):'-'}function esc(v){return String(v??'').replace(/[&<>\"]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]))}
function calc(e){let type=e.salaryType||'月薪', amount=n(e.salaryAmount), al=n(e.allowance), de=n(e.deduction), wh=n(e.workHours)||8, pd=n(e.payDay)||5;let gross=type==='月薪'?amount+al:type==='日薪'?amount*22+al:amount*wh*22+al;let net=gross-de;let t=new Date();t.setHours(0,0,0,0);let y=t.getFullYear(),m=t.getMonth(),d=Math.min(pd,dim(y,m)),nx=new Date(y,m,d);if(nx<t){m++;if(m>11){m=0;y++}nx=new Date(y,m,Math.min(pd,dim(y,m)))}let fd='-',fp='-';if(e.startDate){let s=new Date(e.startDate+'T00:00:00'), sd=dim(s.getFullYear(),s.getMonth()), cnt=sd-s.getDate()+1;fd=cnt+' / '+sd+' 天';let pay=type==='月薪'?gross*(cnt/sd):type==='日薪'?amount*cnt+al:amount*wh*cnt+al;fp=money(pay-de)}return{net,gross,next:fmt(nx),fd,fp}}
function getForm(){return ['id:empid','name:name','dept:dept','position:position','startDate:startDate','salaryType:salaryType','salaryAmount:salaryAmount','payDay:payDay','workHours:workHours','allowance:allowance','deduction:deduction','overtimeRate:overtimeRate','status:status','phone:phone','email:email','bankAccount:bankAccount','salaryNote:salaryNote'].reduce((o,p)=>{let [k,id]=p.split(':');o[k]=$(id).value.trim();return o},{})}function preview(){let c=calc(getForm());$('nextPayDate').textContent=c.next;$('firstMonthDays').textContent=c.fd;$('firstMonthPay').textContent=c.fp;$('monthlyPay').textContent=money(c.net)}
function saveEmp(){if(!needLogin())return;let e=getForm();if(!e.id||!e.name){alert('請至少輸入員工編號與姓名');return}let i=$('editIndex').value;if(i==='')data.push(e);else data[+i]=e;localStorage.setItem(DATA,JSON.stringify(data));clearForm();render()}function clearForm(){['editIndex','empid','name','dept','position','startDate','salaryAmount','phone','email','bankAccount','salaryNote'].forEach(id=>$(id).value='');$('salaryType').value='月薪';$('payDay').value='5';$('workHours').value='8';$('allowance').value='0';$('deduction').value='0';$('overtimeRate').value='0';$('status').value='在職';preview()}function editEmp(i){if(!needLogin())return;let e=data[i];$('editIndex').value=i;for(let k in {id:1,name:1,dept:1,position:1,startDate:1,salaryAmount:1,phone:1,email:1,bankAccount:1,salaryNote:1})$(k==='id'?'empid':k).value=e[k]||'';$('salaryType').value=e.salaryType||'月薪';$('payDay').value=e.payDay||5;$('workHours').value=e.workHours||8;$('allowance').value=e.allowance||0;$('deduction').value=e.deduction||0;$('overtimeRate').value=e.overtimeRate||0;$('status').value=e.status||'在職';preview();scrollTo({top:0,behavior:'smooth'})}function delEmp(i){if(!needLogin())return;if(confirm('確定刪除此員工？')){data.splice(i,1);localStorage.setItem(DATA,JSON.stringify(data));render()}}
function slipCalc(e){let type=e.salaryType||'月薪', amount=n(e.salaryAmount), wh=n(e.workHours)||8, wd=n($('payWorkDays').value), ot=n($('payOvertimeHours').value), bonus=n($('payBonus').value), al=n(e.allowance), baseDed=n(e.deduction), leave=n($('payLeaveDeduction').value), other=n($('payOtherDeduction').value), otpay=n(e.overtimeRate)*ot;let base=type==='月薪'?amount:type==='日薪'?amount*wd:amount*wh*wd;let gross=base+al+bonus+otpay,totalDed=baseDed+leave+other,net=gross-totalDed;return{base,al,bonus,otpay,gross,baseDed,leave,other,totalDed,net,ot}}
function slipHtml(e,prt){let p=slipCalc(e), mon=$('payMonth').value, co=$('companyName').value||'公司名稱', note=$('payslipNote').value||'薪資已依公司規定計算。';return `<!DOCTYPE html><html lang="zh-Hant"><head><meta charset="UTF-8"><title>薪資單_${esc(e.name)}_${mon}</title><style>body{font-family:'Microsoft JhengHei',Arial;margin:24px;background:#f3f4f6}.slip{max-width:780px;margin:0 auto;background:white;border:1px solid #d1d5db;padding:28px;border-radius:10px}.top{text-align:center;border-bottom:3px solid #1f4e79;padding-bottom:12px}h1{color:#1f4e79;margin:0}.info{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:14px 0}.box{border:1px solid #dbe3ee;padding:8px;border-radius:6px}.box b{display:inline-block;min-width:90px}table{width:100%;border-collapse:collapse;margin-top:14px}th,td{border:1px solid #d1d5db;padding:10px}th{background:#eaf2f8}.num{text-align:right}.total{font-weight:800;background:#f8fafc}.net{font-size:20px;color:#0f766e}.sign{display:flex;justify-content:space-between;margin-top:35px}.small{font-size:12px;color:#6b7280}@media print{body{background:white;margin:0}.slip{border:0}.noprint{display:none}}</style></head><body><div class="slip"><div class="top"><h1>${esc(co)}</h1><div>員工薪資單 / Payslip</div></div><div class="info"><div class="box"><b>薪資月份</b>${esc(mon)}</div><div class="box"><b>產生日期</b>${fmt(new Date())}</div><div class="box"><b>員工編號</b>${esc(e.id)}</div><div class="box"><b>姓名</b>${esc(e.name)}</div><div class="box"><b>部門</b>${esc(e.dept)}</div><div class="box"><b>職稱</b>${esc(e.position)}</div><div class="box"><b>到職日</b>${esc(e.startDate)}</div><div class="box"><b>銀行帳號</b>${esc(e.bankAccount)}</div></div><table><tr><th>應發項目</th><th class="num">金額</th></tr><tr><td>基本薪資（${esc(e.salaryType)}）</td><td class="num">${money(p.base)}</td></tr><tr><td>固定津貼</td><td class="num">${money(p.al)}</td></tr><tr><td>獎金/其他加給</td><td class="num">${money(p.bonus)}</td></tr><tr><td>加班費（${p.ot} 小時）</td><td class="num">${money(p.otpay)}</td></tr><tr class="total"><td>應發合計</td><td class="num">${money(p.gross)}</td></tr></table><table><tr><th>扣款項目</th><th class="num">金額</th></tr><tr><td>預設每月扣款</td><td class="num">${money(p.baseDed)}</td></tr><tr><td>請假/事病假扣款</td><td class="num">${money(p.leave)}</td></tr><tr><td>勞健保等其他扣款</td><td class="num">${money(p.other)}</td></tr><tr class="total"><td>扣款合計</td><td class="num">${money(p.totalDed)}</td></tr><tr class="total"><td class="net">實發薪資</td><td class="num net">${money(p.net)}</td></tr></table><p class="small">備註：${esc(note)}<br>薪資條件備註：${esc(e.salaryNote||'無')}</p><div class="sign"><div>員工簽收：________________</div><div>主管/人資：________________</div></div><p class="small noprint">可用瀏覽器列印，或另存為 PDF。</p></div>${prt?'<script>window.onload=function(){window.print()}<\/script>':''}</body></html>`}
function download(fn,content,type='text/html;charset=utf-8'){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=fn;a.click()}function exportPayslip(i){if(!needLogin())return;let e=data[i], mon=$('payMonth').value||'未設定月份', h=slipHtml(e,true);download(`薪資單_${e.id}_${e.name}_${mon}.html`,h);let w=open('','_blank');if(w){w.document.write(h);w.document.close()}}function exportAllPayslips(){if(!needLogin())return;if(!data.length){alert('尚無員工資料');return}let body=data.map(e=>slipHtml(e,false).match(/<body>([\s\S]*)<\/body>/)[1]).join('<div style="page-break-after:always"></div>');download('全部員工薪資單_'+($('payMonth').value||'未設定月份')+'.html','<!DOCTYPE html><html lang="zh-Hant"><meta charset="UTF-8"><body>'+body+'</body></html>')}
function exportCSV(){if(!needLogin())return;let head=['員工編號','姓名','部門','職稱','到職日','薪資類型','薪資金額','津貼','扣款','發薪日','月薪估算','狀態','電話','Email','銀行帳號','備註'];let lines=[head.join(',')];data.forEach(e=>{let c=calc(e);lines.push([e.id,e.name,e.dept,e.position,e.startDate,e.salaryType,e.salaryAmount,e.allowance,e.deduction,e.payDay,c.net,e.status,e.phone,e.email,e.bankAccount,e.salaryNote].map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(','))});download('員工薪資資料_'+fmt(new Date())+'.csv','\ufeff'+lines.join('\n'),'text/csv;charset=utf-8')}function clearAll(){if(!needLogin())return;if(confirm('確定清除全部資料？')){data=[];localStorage.removeItem(DATA);render()}}
function render(){let kw=($('keyword').value||'').toLowerCase(), rows='', cnt=0;data.forEach((e,i)=>{if(kw&&!Object.values(e).join(' ').toLowerCase().includes(kw))return;cnt++;let c=calc(e);rows+=`<tr><td>${esc(e.id)}</td><td>${esc(e.name)}</td><td>${esc(e.dept)}</td><td class="hide-mobile">${esc(e.position)}</td><td>${esc(e.startDate)}</td><td>${esc(e.salaryType)} ${money(n(e.salaryAmount))}</td><td>每月 ${esc(e.payDay||5)} 日</td><td>${c.next}</td><td class="num">${money(c.net)}</td><td>${esc(e.status)}</td><td><button onclick="editEmp(${i})">編輯</button> <button class="warn" onclick="exportPayslip(${i})">薪資單</button> <button class="danger" onclick="delEmp(${i})">刪除</button></td></tr>`});$('tb').innerHTML=rows||'<tr><td colspan="11" class="center small">尚無資料</td></tr>';$('countInfo').textContent=cnt+' 筆資料'}
preview();render();updateLogin();
</script></body></html>
