        function calculatePayroll(emp, config = { hourlyDivisor: 240 }) {
            const baseSalary = Number(emp.baseSalary) || 0;
            const foodAllowance = Number(emp.foodAllowance) || 0;
            const positionAllowance = Number(emp.positionAllowance) || 0;
            const regularMonthlySalary = baseSalary + foodAllowance + positionAllowance;
            
            const divisor = Number(config.hourlyDivisor) || 240;
            const hourlyRate = regularMonthlySalary / divisor;

            // 1. 加班費計算
            const otWeekday1Pay = (emp.weekdayOt1 || 0) * hourlyRate * (4 / 3);
            const otWeekday2Pay = (emp.weekdayOt2 || 0) * hourlyRate * (5 / 3);

            let otRestDayPay = 0;
            const restHours = emp.restDayOt || 0;
            if (restHours <= 2) {
                otRestDayPay = restHours * hourlyRate * (4 / 3);
            } else if (restHours <= 8) {
                otRestDayPay = (2 * hourlyRate * (4 / 3)) + ((restHours - 2) * hourlyRate * (5 / 3));
            } else {
                otRestDayPay = (2 * hourlyRate * (4 / 3)) + (6 * hourlyRate * (5 / 3)) + ((restHours - 8) * hourlyRate * (8 / 3));
            }

            const otHolidayPay = (emp.holidayOt || 0) * hourlyRate * 1.0;
            const totalOtPay = Math.round(otWeekday1Pay + otWeekday2Pay + otRestDayPay + otHolidayPay);

            // 2. 請假扣款計算
            const personalLeaveDeduction = (emp.personalLeave || 0) * hourlyRate * 1.0;
            const sickLeaveDeduction = (emp.sickLeave || 0) * hourlyRate * 0.5;
            const menstrualLeaveDeduction = (emp.menstrualLeave || 0) * hourlyRate * 0.5;
            const totalLeaveDeduction = Math.round(personalLeaveDeduction + sickLeaveDeduction + menstrualLeaveDeduction);

            // 3. 應發合計 (Gross Earnings)
            const bonus = Number(emp.bonus) || 0;
            const totalEarnings = regularMonthlySalary + bonus + totalOtPay;

            // 4. 勞健保級距與自負/雇主負擔
            const laborBracket = emp.laborBracket || getMatchedLaborBracket(regularMonthlySalary).amount;
            const healthBracket = emp.healthBracket || getMatchedHealthBracket(regularMonthlySalary).amount;
            const dependents = Number(emp.dependents) || 0;

            const matchedLabor = LABOR_INS_BRACKETS.find(b => b.amount === laborBracket) || getMatchedLaborBracket(regularMonthlySalary);
            const matchedHealth = HEALTH_INS_BRACKETS.find(b => b.amount === healthBracket) || getMatchedHealthBracket(regularMonthlySalary);

            const laborIns = emp.laborIns !== undefined && emp.laborIns !== null ? Number(emp.laborIns) : matchedLabor.employee;
            const calcHealthIns = Math.round(matchedHealth.employeeBase * (1 + Math.min(dependents, 3)));
            const healthIns = emp.healthIns !== undefined && emp.healthIns !== null ? Number(emp.healthIns) : calcHealthIns;

            const employerLaborIns = matchedLabor.employer;
            const employerHealthIns = matchedHealth.employerBase;
            const pensionEmployerContribution = Math.round(regularMonthlySalary * 0.06);
            const totalEmployerBurden = employerLaborIns + employerHealthIns + pensionEmployerContribution;

            // 5. 應扣合計 (Total Deductions)
            const tax = Number(emp.tax) || 0;
            const totalDeductions = laborIns + healthIns + tax + totalLeaveDeduction;

            // 6. 實發薪資淨額 (Net Pay)
            const netPay = totalEarnings - totalDeductions;

            return {
                hourlyRate: Math.round(hourlyRate * 100) / 100,
                regularMonthlySalary,
                otWeekday1Pay: Math.round(otWeekday1Pay),
                otWeekday2Pay: Math.round(otWeekday2Pay),
                otRestDayPay: Math.round(otRestDayPay),
                otHolidayPay: Math.round(otHolidayPay),
                totalOtPay,
                personalLeaveDeduction: Math.round(personalLeaveDeduction),
                sickLeaveDeduction: Math.round(sickLeaveDeduction),
                menstrualLeaveDeduction: Math.round(menstrualLeaveDeduction),
                totalLeaveDeduction,
                totalEarnings,
                laborBracket,
                healthBracket,
                dependents,
                laborIns,
                healthIns,
                employerLaborIns,
                employerHealthIns,
                pensionEmployerContribution,
                totalEmployerBurden,
                totalDeductions,
                netPay
            };
        }

                                                        className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500 font-mono"
                                                        required
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-slate-700 font-semibold mb-1">員工姓名</label>
                                                    <input
                                                        type="text"
                                                        value={editingEmp.name}
                                                        onChange={(e) => setEditingEmp({ ...editingEmp, name: e.target.value })}
                                                        className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500 font-bold"
                                                        required
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-slate-700 font-semibold mb-1">所屬部門</label>
                                                    <input
                                                        type="text"
                                                        value={editingEmp.department}
                                                        onChange={(e) => setEditingEmp({ ...editingEmp, department: e.target.value })}
                                                        className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-slate-700 font-semibold mb-1">職務稱謂</label>
                                                    <input
                                                        type="text"
                                                        value={editingEmp.title}
                                                        onChange={(e) => setEditingEmp({ ...editingEmp, title: e.target.value })}
                                                        className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500"
                                                    />
                                                </div>
                                                <div className="sm:col-span-2">
                                                    <label className="block text-slate-700 font-semibold mb-1">電子郵件 (Email)</label>
                                                    <input
                                                        type="email"
                                                        value={editingEmp.email || ''}
                                                        onChange={(e) => setEditingEmp({ ...editingEmp, email: e.target.value })}
                                                        className="w-full p-2.5 border border-slate-300 rounded-xl focus:ring-2 focus:ring-sky-500 font-mono"
                                                    />
                                                </div>
                                            </div>
                                        )}

                                        {/* Tab 2: Salary & Allowance */}
                                        {editModalTab === 'salary' && (
                                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                                <div>
                                                    <label className="block text-slate-700 font-semibold mb-1">基本底薪 (NT$)</label>
                                                    <input
                                                        type="number"
                                                        value={editingEmp.baseSalary}
                                                        onChange={(e) => setEditingEmp({ ...editingEmp, baseSalary: Number(e.target.value) })}
                                                        className="w-full p-2.5 border border-slate-300 rounded-xl font-mono text-sm font-bold text-slate-800"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-slate-700 font-semibold mb-1">伙食津貼 (NT$)</label>
                                                    <input
                                                        type="number"
                                                        value={editingEmp.foodAllowance}
                                                        onChange={(e) => setEditingEmp({ ...editingEmp, foodAllowance: Number(e.target.value) })}
                                                        className="w-full p-2.5 border border-slate-300 rounded-xl font-mono"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-slate-700 font-semibold mb-1">職務加給 / 津貼 (NT$)</label>
                                                    <input
                                                        type="number"
                                                        value={editingEmp.positionAllowance}
                                                        onChange={(e) => setEditingEmp({ ...editingEmp, positionAllowance: Number(e.target.value) })}
                                                        className="w-full p-2.5 border border-slate-300 rounded-xl font-mono"
                                                    />
                                                </div>
                                                <div>
                                                    <label className="block text-slate-700 font-semibold mb-1">績效與其他獎金 (NT$)</label>
                                                    <input
                                                        type="number"
                                                        value={editingEmp.bonus}
                                                        onChange={(e) => setEditingEmp({ ...editingEmp, bonus: Number(e.target.value) })}
                                                        className="w-full p-2.5 border border-slate-300 rounded-xl font-mono text-emerald-600 font-bold"
                                                    />
                                                </div>
                                            </div>
                                        )}

                                        {/* Tab 3: Attendance & Overtime */}
                                        {editModalTab === 'attendance' && (
                                            <div className="space-y-4">
                                                <div className="bg-amber-50/60 p-3.5 rounded-xl border border-amber-200">
                                                    <h4 className="font-bold text-amber-900 mb-2">⏱️ 加班時數設定 (依勞基法計算費率)</h4>
                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                                        <div>
                                                            <label className="block text-[11px] text-amber-900 font-medium mb-1">平日加班 前2h (1.34倍)</label>
                                                            <input
                                                                type="number"
                                                                step="0.5"
                                                                value={editingEmp.weekdayOt1}
                                                                onChange={(e) => setEditingEmp({ ...editingEmp, weekdayOt1: Number(e.target.value) })}
                                                                className="w-full p-2 border border-amber-300 rounded-lg font-mono text-center font-bold"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[11px] text-amber-900 font-medium mb-1">平日加班 後2h (1.67倍)</label>
                                                            <input
                                                                type="number"
                                                                step="0.5"
                                                                value={editingEmp.weekdayOt2}
                                                                onChange={(e) => setEditingEmp({ ...editingEmp, weekdayOt2: Number(e.target.value) })}
                                                                className="w-full p-2 border border-amber-300 rounded-lg font-mono text-center font-bold"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[11px] text-amber-900 font-medium mb-1">休息日加班 (1.34/1.67)</label>
                                                            <input
                                                                type="number"
                                                                step="0.5"
                                                                value={editingEmp.restDayOt}
                                                                onChange={(e) => setEditingEmp({ ...editingEmp, restDayOt: Number(e.target.value) })}
                                                                className="w-full p-2 border border-amber-300 rounded-lg font-mono text-center font-bold"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[11px] text-amber-900 font-medium mb-1">國定假日加班 (加倍1.0)</label>
                                                            <input
                                                                type="number"
                                                                step="0.5"
                                                                value={editingEmp.holidayOt}
                                                                onChange={(e) => setEditingEmp({ ...editingEmp, holidayOt: Number(e.target.value) })}
                                                                className="w-full p-2 border border-amber-300 rounded-lg font-mono text-center font-bold"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="bg-rose-50/60 p-3.5 rounded-xl border border-rose-200">
                                                    <h4 className="font-bold text-rose-900 mb-2">🌴 請假時數設定 (依勞工請假規則扣款)</h4>
                                                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                                                        <div>
                                                            <label className="block text-[11px] text-rose-900 font-medium mb-1">事假時數 (扣100%)</label>
                                                            <input
                                                                type="number"
                                                                step="0.5"
                                                                value={editingEmp.personalLeave}
                                                                onChange={(e) => setEditingEmp({ ...editingEmp, personalLeave: Number(e.target.value) })}
                                                                className="w-full p-2 border border-rose-300 rounded-lg font-mono text-center font-bold text-rose-700"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[11px] text-rose-900 font-medium mb-1">病假時數 (扣50%)</label>
                                                            <input
                                                                type="number"
                                                                step="0.5"
                                                                value={editingEmp.sickLeave}
                                                                onChange={(e) => setEditingEmp({ ...editingEmp, sickLeave: Number(e.target.value) })}
                                                                className="w-full p-2 border border-rose-300 rounded-lg font-mono text-center font-bold text-rose-700"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[11px] text-rose-900 font-medium mb-1">生理假時數 (扣50%)</label>
                                                            <input
                                                                type="number"
                                                                step="0.5"
                                                                value={editingEmp.menstrualLeave}
                                                                onChange={(e) => setEditingEmp({ ...editingEmp, menstrualLeave: Number(e.target.value) })}
                                                                className="w-full p-2 border border-rose-300 rounded-lg font-mono text-center font-bold text-rose-700"
                                                            />
                                                        </div>
                                                        <div>
                                                            <label className="block text-[11px] text-slate-700 font-medium mb-1">特別休假 (全薪)</label>
                                                            <input
                                                                type="number"
                                                                step="0.5"
                                                                value={editingEmp.specialLeave}
                                                                onChange={(e) => setEditingEmp({ ...editingEmp, specialLeave: Number(e.target.value) })}
                                                                className="w-full p-2 border border-slate-300 rounded-lg font-mono text-center font-bold text-slate-600"
                                                            />
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        )}

                                        {/* Tab 4: Insurance Brackets & Taxes */}
                                        {editModalTab === 'tax' && (
                                            <div className="space-y-4">
                                                {/* Auto-match Banner */}
                                                <div className="bg-sky-50 border border-sky-200 p-3.5 rounded-xl flex items-center justify-between">
                                                    <div>
                                                        <span className="font-bold text-sky-900 block">⚡ 勞健保官方級距自動對照</span>
                                                        <span className="text-[11px] text-sky-700">可依該員工經常性月薪 (底薪+伙食+職務津貼) 自動選定級距。</span>
                                                    </div>
                                                    <button
                                                        type="button"
                                                        onClick={autoMatchInsuranceBrackets}
                                                        className="px-3.5 py-1.5 bg-sky-600 hover:bg-sky-500 text-white rounded-lg font-bold text-xs shadow-sm transition-all whitespace-nowrap"
                                                    >
                                                        按月薪自動對照 ➔
                                                    </button>
                                                </div>

                                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                                    <div>
                                                        <label className="block text-slate-700 font-semibold mb-1">勞保投保薪資級距</label>
                                                        <select
                                                            value={editingEmp.laborBracket || previewCalc.laborBracket}
                                                            onChange={(e) => {
                                                                const val = Number(e.target.value);
                                                                const matched = LABOR_INS_BRACKETS.find(b => b.amount === val);
                                                                setEditingEmp({
                                                                    ...editingEmp,
                                                                    laborBracket: val,
                                                                    laborIns: matched ? matched.employee : editingEmp.laborIns
                                                                });
                                                            }}
                                                            className="w-full p-2.5 border border-slate-300 rounded-xl font-mono text-xs focus:ring-2 focus:ring-sky-500"
                                                        >
                                                            {LABOR_INS_BRACKETS.map(b => (
                                                                <option key={b.level} value={b.amount}>
                                                                    第{b.level}級 - NT$ {b.amount.toLocaleString()} (個人自負 ${b.employee})
                                                                </option>
                                                            ))}
                                                        </select>
                                                    </div>

                                                    <div>
                                                        <label className="block text-slate-700 font-semibold mb-1">健保投保金額級距</label>
                                                        <select
                                                            value={editingEmp.healthBracket || previewCalc.healthBracket}
                                                            onChange={(e) => {
                                                                const val = Number(e.target.value);
                                                                const matched = HEALTH_INS_BRACKETS.find(b => b.amount === val);
                                                                const deps = Number(editingEmp.dependents) || 0;
                                                                const calcHealth = matched ? Math.round(matched.employeeBase * (1 + Math.min(deps, 3))) : editingEmp.healthIns;
                                                                setEditingEmp({
                                                                    ...editingEmp,
                                                                    healthBracket: val,
                                                                    healthIns: calcHealth
                                                                });
                                                            }}
                                                            className="w-full p-2.5 border border-slate-300 rounded-xl font-mono text-xs focus:ring-2 focus:ring-sky-500"
                                                        >
                                                            {HEALTH_INS_BRACKETS.map(b => (
                                                                <option key={b.level} value={b.amount}>
                                                                    第{b.level}級 - NT$ {b.amount.toLocaleString()} (0眷自負 ${b.employeeBase})
                                                                </option>
                                                            ))}
                                                        </select>
                                                    </div>

                                                    <div>
                                                        <label className="block text-slate-700 font-semibold mb-1">健保眷屬人數 (0~3口)</label>
                                                        <input
                                                            type="number"
                                                            min="0"
                                                            max="10"
                                                            value={editingEmp.dependents || 0}
                                                            onChange={(e) => {
                                                                const deps = Number(e.target.value);
                                                                const matched = HEALTH_INS_BRACKETS.find(b => b.amount === (editingEmp.healthBracket || previewCalc.healthBracket));
                                                                const calcHealth = matched ? Math.round(matched.employeeBase * (1 + Math.min(deps, 3))) : editingEmp.healthIns;
                                                                setEditingEmp({
                                                                    ...editingEmp,
                                                                    dependents: deps,
                                                                    healthIns: calcHealth
                                                                });
                                                            }}
                                                            className="w-full p-2.5 border border-slate-300 rounded-xl font-mono"
                                                        />
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                                    <div>
                                                        <label className="block text-slate-700 font-semibold mb-1">勞保費個人扣額 (NT$)</label>
                                                        <input
                                                            type="number"
                                                            value={editingEmp.laborIns}
                                                            onChange={(e) => setEditingEmp({ ...editingEmp, laborIns: Number(e.target.value) })}
                                                            className="w-full p-2.5 border border-slate-300 rounded-xl font-mono"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-slate-700 font-semibold mb-1">健保費個人扣額 (NT$)</label>
                                                        <input
                                                            type="number"
                                                            value={editingEmp.healthIns}
                                                            onChange={(e) => setEditingEmp({ ...editingEmp, healthIns: Number(e.target.value) })}
                                                            className="w-full p-2.5 border border-slate-300 rounded-xl font-mono"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-slate-700 font-semibold mb-1">代扣所得稅 (NT$)</label>
                                                        <input
                                                            type="number"
                                                            value={editingEmp.tax}
                                                            onChange={(e) => setEditingEmp({ ...editingEmp, tax: Number(e.target.value) })}
                                                            className="w-full p-2.5 border border-slate-300 rounded-xl font-mono text-indigo-700 font-bold"
                                                        />
                                                    </div>
                                                </div>
                                            </div>
                                        )}
                                    </form>

                                    {/* Real-time Calculation Summary Card Footer */}
                                    <div className="bg-slate-900 text-white p-4 border-t border-slate-800 flex-shrink-0">
                                        <div className="grid grid-cols-2 sm:grid-cols-5 gap-3 text-xs mb-3 pb-3 border-b border-slate-800 font-mono">
                                            <div>
                                                <span className="text-slate-400 block text-[10px]">勞保級距</span>
                                                <span className="font-bold text-blue-400">NT$ {previewCalc.laborBracket.toLocaleString()}</span>
                                            </div>
                                            <div>
                                                <span className="text-slate-400 block text-[10px]">健保級距</span>
                                                <span className="font-bold text-emerald-400">NT$ {previewCalc.healthBracket.toLocaleString()}</span>
                                            </div>
                                            <div>
                                                <span className="text-slate-400 block text-[10px]">個人勞健保自負</span>
                                                <span className="font-bold text-rose-400">NT$ {(previewCalc.laborIns + previewCalc.healthIns).toLocaleString()}</span>
                                            </div>
                                            <div>
                                                <span className="text-slate-400 block text-[10px]">雇主法定負擔總額</span>
                                                <span className="font-bold text-purple-300">NT$ {previewCalc.totalEmployerBurden.toLocaleString()}</span>
                                            </div>
                                            <div>
                                                <span className="text-slate-400 block text-[10px]">預估實發 Net Pay</span>
                                                <span className="font-extrabold text-sky-400 text-sm">NT$ {previewCalc.netPay.toLocaleString()}</span>
                                            </div>
                                        </div>

                                        <div className="flex justify-between items-center">
                                            <span className="text-[11px] text-slate-400">
                                                💡 點擊「儲存更新」後將同時反映於總表與個人薪資單。
                                            </span>
                                            <div className="flex space-x-2">
                                                <button
                                                    type="button"
                                                    onClick={() => setEditingEmp(null)}
                                                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-bold transition-all"
                                                >
                                                    取消
                                                </button>
                                                <button
                                                    type="submit"
                                                    form="edit-employee-form"
                                                    className="px-6 py-2 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold rounded-xl shadow-lg shadow-sky-500/20 transition-all transform active:scale-95"
                                                >
                                                    儲存更新紀錄 ➔
                                                </button>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        );
                    })()}
                </div>
            );
        }

        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
